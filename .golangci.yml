version: "2"

run:
  timeout: 5m

# goconst is deliberately absent. Its premise — a repeated string
# literal implies a missing constant — does not hold for what this
# codebase repeats: JSON field names ("count", "text", "path") and
# external command vocabulary ("apt", "brew", "npm", "curl-sh"). A
# const for a JSON key is worse than the literal at the call site, and
# a typo in "apt" fails loudly on first run rather than silently. The
# two genuine cases it did find — the soul emotive-dimension names and
# "soul_tune" — are now constants and stay that way without it.
#
# It also counts differently across releases: v2.10 reported none of
# this, v2.12 reported 138. Keeping it would mean re-tuning thresholds
# against every upgrade for findings that were never bugs.
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - unconvert
    - gocyclo
    - gocritic
    - revive
    - forbidigo
  exclusions:
    paths:
      # Claude Code checks agent worktrees out inside the repository, so a
      # local run otherwise walks a full second copy of the tree and reports
      # every finding twice — against paths that are gitignored and absent
      # from a CI checkout.
      - \.claude
    rules:
      # internal/egress/ is the chokepoint package — it legitimately
      # constructs http.Client and uses http.* functions. The lint
      # rule blocks new call sites elsewhere from doing the same.
      - path: ^internal/egress/
        linters: [forbidigo]
      # Test files commonly use httptest + http.DefaultClient; the
      # rule only matters for production code paths.
      - path: _test\.go$
        linters: [forbidigo]
      # Table-driven tests repeat their fixture strings by design —
      # "alice", "pending", "windows". Hoisting those into constants
      # makes the table harder to read and couples unrelated cases
      # to a shared name. goconst only earns its keep in production
      # code, where a repeated literal is a value that can drift.
      - path: _test\.go$
        linters: [goconst]
      # The OpenAI chat-completions vocabulary — message roles and
      # finish_reason values. These are an external protocol's fixed
      # strings, not lobslaw values that could drift, and they are
      # already documented in one place on compute.Message.Role.
      # Hoisting them into constants would touch ~30 call sites
      # through the agent loop to protect against a typo the provider
      # would reject on the first request anyway. Contrast the soul
      # dimension names, which ARE now constants: those are our own
      # vocabulary and a typo there silently no-ops instead of
      # failing.
      - path: ^internal/compute/
        text: 'string `(tool|tool_calls|assistant|user|system|stop)` has'
        linters: [goconst]
      # revive's `exported` rule is enforced on pkg/ (see the
      # doc-comment pass) but not here. Identifiers under internal/
      # and cmd/ are unreachable outside this module, so "exported"
      # is a package-boundary detail rather than public API, and a
      # doc comment on every one of them is noise with no audience.
      # Godoc for these packages is the package comment plus the
      # comments that already exist where the intent is non-obvious.
      - path: ^(internal|cmd)/
        text: '^exported:'
        linters: [revive]
      # pkg/crypto shadows the stdlib `crypto` name. That is
      # deliberate and long-standing: it is this project's crypto
      # package, always imported as a lobslaw path, and renaming it
      # would churn every call site to satisfy a naming opinion.
      - path: ^pkg/crypto/
        text: 'avoid package names that conflict'
        linters: [revive]
      # pkg/types is flagged as a "meaningless" package name. It is
      # the deliberate shared-vocabulary layer described in its own
      # doc.go — the one package that imports nothing from internal/
      # — and the name is load-bearing documentation, not laziness.
      - path: ^pkg/types/
        text: 'avoid meaningless package names'
        linters: [revive]
  settings:
    gocyclo:
      # Raised from 15. gocyclo counts every switch case, and this
      # codebase leans on wide flat dispatch switches — config
      # parsing, provider selection, builtin routing — that score
      # 16-25 while staying entirely readable. 38 of the 60 findings
      # at 15 were in that 16-20 band and refactoring them would be
      # churn that makes the code worse.
      #
      # 30 is the point where a finding reliably means "this function
      # is genuinely doing too much". Three functions still exceed it
      # and carry a nolint naming the reason; they are real debt and
      # should come down rather than have this number raised again.
      min-complexity: 30
    misspell:
      ignore-rules:
        # "hardlinked" is the filesystem term, not a misspelling of
        # "hardline".
        - hardlinked
    staticcheck:
      checks:
        - all
        # QF1001 rewrites `!(a && b)` into `!a || !b`. Both forms are
        # correct, and the negated-conjunction reading is usually the
        # clearer one — every instance here is an ordering assertion
        # of the form `!(posA < posB && posB < posC)`, which De
        # Morgan turns into a chain of `>=` that has to be re-derived
        # to check. Declining a style opinion; the rest of
        # staticcheck stays on.
        - -QF1001
    forbidigo:
      # Egress chokepoint: every outbound HTTPS must go via
      # internal/egress/. Block direct http.Client construction +
      # the package-level convenience functions (http.Get, http.Post,
      # http.PostForm) so a new caller can't accidentally bypass
      # the proxy. Tests inside internal/egress/ are exempt; the
      # smokescreen provider also constructs an http.Server which
      # is not blocked here (only http.Client is).
      forbid:
        - pattern: 'http\.Client\{'
          msg: 'use egress.For(role) instead of constructing http.Client directly — see internal/egress/'
        - pattern: '^http\.Get$'
          msg: 'use egress.For(role).HTTPClient().Get instead of http.Get — see internal/egress/'
        - pattern: '^http\.Post$'
          msg: 'use egress.For(role).HTTPClient().Post instead of http.Post — see internal/egress/'
        - pattern: '^http\.PostForm$'
          msg: 'use egress.For(role).HTTPClient().PostForm instead of http.PostForm — see internal/egress/'
        - pattern: '^http\.Head$'
          msg: 'use egress.For(role).HTTPClient().Head instead of http.Head — see internal/egress/'
        - pattern: '^http\.DefaultClient$'
          msg: 'use egress.For(role) instead of http.DefaultClient — see internal/egress/'
      exclude-godoc-examples: true
      analyze-types: true
    revive:
      rules:
        - name: exported
          disabled: false
        - name: var-naming
        - name: package-comments
        - name: indent-error-flow
        - name: errorf
        - name: context-as-argument
        - name: context-keys-type
        - name: error-return
        - name: error-strings
        - name: unused-parameter
          disabled: true

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/jmylchreest/lobslaw

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
