# The catalogue: what each program DOES.
#
# Data, and the same grammar an operator writes. [compute.command_risks]
# is unmarshalled by the same code into the same type, so a deployment
# can express anything this file can — that was not true when this was a
# Go map and the config was a struct hand-maintained to mirror it.
#
# EXTENDING IT DOES NOT REQUIRE EDITING THIS FILE:
#
#     [compute.command_risks]
#     terraform = { labels = ["reads"], subcommands = { destroy = ["deletes", "disrupts"] } }
#
# A pull request here is for entries everyone should have; config is for
# the ones only you have.
#
# Two rules govern every entry, and both are about being wrong safely:
#
#   - A program that is not here is UNREADABLE, so an incomplete
#     catalogue asks rather than waves through. Entries are added when
#     somebody has thought about what the program does with every flag
#     it might carry, not to make the list look finished.
#   - A program whose verb is a subcommand or a flag, and whose verb is
#     not listed, is unreadable too — never the base labels. `pacman
#     -Rdd` must not read as "reads" because nobody enumerated -Rdd.
#
# Labels are exactly: reads, writes, deletes, disrupts, network,
# privilege, unreadable. An unknown label fails the build, rather than
# being dropped — a typo that silently removed a "deletes" would leave
# the command classified as whatever remained.
#
# `extends` inherits another entry, field by field, so a family that
# behaves identically is stated once and cannot drift apart.

