syntax = "proto3";

package lobslaw.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// -----------------------------------------------------------------------------
// Common types
// -----------------------------------------------------------------------------

// Visibility is who may read a record besides its owner.
//
// UNSPECIFIED is the legacy value: records written before ownership
// existed carry it alongside an empty owner, and readers treat that
// pair as "visible to everyone" so an upgrade does not silently hide a
// single-user node's entire memory. New records always set one of the
// two real values.
enum Visibility {
  VISIBILITY_UNSPECIFIED = 0;
  // Readable only by the owning principal.
  VISIBILITY_PRIVATE = 1;
  // Readable by any authenticated principal on the cluster. For
  // operator-seeded knowledge and anything the agent learns that is
  // about the deployment rather than about a person.
  VISIBILITY_SHARED = 2;
}

message NodeInfo {
  string id = 1;
  repeated string functions = 2; // "memory" | "policy" | "compute" | "gateway" | "storage"
  string address = 3; // host:port of the cluster gRPC listener
  repeated string capabilities = 4;
  bool raft_member = 5;
}

message HealthStatus {
  string node_id = 1;
  string status = 2; // "healthy" | "degraded" | "unhealthy"
  google.protobuf.Timestamp last_seen = 3;
  repeated ComponentHealth components = 4;
}

message ComponentHealth {
  string name = 1;
  string status = 2;
  string error = 3;
}

// -----------------------------------------------------------------------------
// NodeService — cluster membership, heartbeat, reload
// -----------------------------------------------------------------------------

service NodeService {
  rpc Register(RegisterRequest) returns (RegisterResponse);
  rpc Deregister(DeregisterRequest) returns (DeregisterResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc GetPeers(GetPeersRequest) returns (GetPeersResponse);
  rpc Reload(ReloadRequest) returns (ReloadResponse);
  rpc AddMember(AddMemberRequest) returns (AddMemberResponse);

  // Propose applies one already-marshalled LogEntry on the Raft
  // leader, on behalf of a follower that received the write.
  //
  // Only the leader may write, but a user's message lands on
  // whichever gateway node they happened to reach, which is
  // uncorrelated with leadership. Without this a follower cannot
  // persist a conversation turn at all.
  //
  // Leader-only and non-forwarding by construction: a node that is
  // not the leader returns FAILED_PRECONDITION rather than passing
  // the entry on, so a forward is always exactly one hop and a
  // cycle is impossible.
  //
  // This grants a peer no authority it did not already have. The
  // Raft transport shares this gRPC server and the same cluster
  // mTLS identity, and it already accepts arbitrary log
  // replication — the trust boundary is cluster membership, not
  // this method.
  rpc Propose(ProposeRequest) returns (ProposeResponse);
}

message ProposeRequest {
  // Marshalled LogEntry. Opaque here so the entry schema can evolve
  // without touching the forwarding path.
  bytes entry = 1;
}
message ProposeResponse {}

message RegisterRequest {
  NodeInfo node = 1;
}
message RegisterResponse {
  bool accepted = 1;
  string reason = 2;
}

message DeregisterRequest {
  string node_id = 1;
}
message DeregisterResponse {}

message HeartbeatRequest {
  string node_id = 1;
  HealthStatus health = 2;
}
message HeartbeatResponse {}

message GetPeersRequest {}
message GetPeersResponse {
  repeated NodeInfo peers = 1;
}

message ReloadRequest {
  // Empty list = reload everything reloadable.
  repeated string sections = 1;
}
message ReloadResponse {
  repeated string reloaded = 1;
  repeated string restart_needed = 2;
  map<string, string> errors = 3;
}

message AddMemberRequest {
  string node_id = 1;
  string address = 2; // host:port peers dial to reach the joining node
  bool voter = 3; // true = voting member; non-voting learners are future work
}
message AddMemberResponse {
  bool accepted = 1;
  // LeaderAddress is set when the handler wasn't the leader. Callers
  // retry against that address. Empty when there's no leader yet.
  string leader_address = 2;
}

// -----------------------------------------------------------------------------
// SkillService — install, inspect and remove skills on a RUNNING cluster
// -----------------------------------------------------------------------------
//
// The BYTES travel, not a path. `lobslaw skills import` runs on
// somebody's laptop and the cluster is elsewhere, so a service taking a
// directory would be reading one that does not exist on the node.
service SkillService {
  rpc ImportSkill(ImportSkillRequest) returns (ImportSkillResponse);
  rpc ExportSkill(ExportSkillRequest) returns (ExportSkillResponse);
  rpc ListSkills(ListSkillsRequest) returns (ListSkillsResponse);
  rpc RemoveSkill(RemoveSkillRequest) returns (RemoveSkillResponse);
  // ActivateSkill makes a stored version the one in force. This is
  // what `lobslaw skills rollback` calls — a rollback is nothing more
  // than activating a version that is already in the log.
  rpc ActivateSkill(ActivateSkillRequest) returns (ActivateSkillResponse);
}

message ImportSkillRequest {
  string name = 1;
  string version = 2;
  SkillTier tier = 3;
  // manifest_yaml travels VERBATIM. Re-encoding anywhere on this path
  // breaks a detached signature permanently.
  bytes manifest_yaml = 4;
  bytes manifest_sig = 5;
  map<string, bytes> files = 6;
  string source = 7;
  string imported_by = 8;
  bool activate = 9;
}

message ImportSkillResponse {
  SkillRecord skill = 1;
}

message ExportSkillRequest {
  string name = 1;
  string version = 2;
}

message ExportSkillResponse {
  bytes manifest_yaml = 1;
  bytes manifest_sig = 2;
  map<string, bytes> files = 3;
}

message ListSkillsRequest {
  // active_only narrows to the version in force per (name, tier).
  bool active_only = 1;
}

message ListSkillsResponse {
  repeated SkillRecord skills = 1;
}

message RemoveSkillRequest {
  string name = 1;
  string version = 2;
}

message RemoveSkillResponse {}

message ActivateSkillRequest {
  string name = 1;
  string version = 2;
}
message ActivateSkillResponse {
  SkillRecord skill = 1;
  // already_active reports that the version asked for was the one in
  // force. The call succeeds either way — an operator scripting a
  // rollback should not have to special-case having already done it.
  bool already_active = 2;
}

// -----------------------------------------------------------------------------
// SelfLearningService — inspect and decide on what the agent taught itself
// -----------------------------------------------------------------------------
//
// The offline `lobslaw learned` CLI opens state.db directly, which
// means bbolt's exclusive lock, which means the node must be stopped.
// That is a fine shape for forensics and a terrible one for approval:
// approving a proposal is a routine act, and requiring a service
// outage to perform it guarantees that nobody does it — after which
// propose mode is a queue that only fills.
//
// So the same operations are reachable on a RUNNING cluster. Writes
// forward to the leader like every other write; the offline CLI stays
// for the case where the node will not start.
//
// Deliberately NOT reachable from a conversation. Approval is the act
// that decides whether the agent's own suggestion becomes something it
// follows, and routing it through the channel the agent writes in puts
// the request and the approval on the same wire. The in-channel path
// is a later, separate decision, and it will sit on the durable
// confirmation records rather than on this service.
service SelfLearningService {
  rpc ListArtefacts(ListArtefactsRequest) returns (ListArtefactsResponse);
  rpc ApproveArtefact(ApproveArtefactRequest) returns (ApproveArtefactResponse);
  rpc DecideRevision(DecideRevisionRequest) returns (DecideRevisionResponse);
  rpc ArchiveArtefact(ArchiveArtefactRequest) returns (ArchiveArtefactResponse);
  rpc RestoreArtefact(RestoreArtefactRequest) returns (RestoreArtefactResponse);

  // ListArtefactHistory returns the prior versions kept for rollback,
  // newest first, alongside the version in force.
  rpc ListArtefactHistory(ListArtefactHistoryRequest) returns (ListArtefactHistoryResponse);

  // RollbackArtefact puts a prior version back in force. With apply
  // unset it reports what would be restored and writes nothing.
  rpc RollbackArtefact(RollbackArtefactRequest) returns (RollbackArtefactResponse);
}

message ListArtefactsRequest {
  // state filters the live set. UNSPECIFIED returns everything live.
  SelfTaughtState state = 1;
  // archived reads the archive instead of the live set.
  bool archived = 2;
}

message ListArtefactsResponse {
  repeated SelfTaughtRecord artefacts = 1;
}

message ApproveArtefactRequest {
  string id = 1;
  // approved_by is recorded on the record. Required: an approval
  // nobody is named on is one nobody can be asked about.
  string approved_by = 2;
}

message ApproveArtefactResponse {
  SelfTaughtRecord artefact = 1;
}

// DecideRevision accepts or rejects a refinement staged against a live
// artefact. One RPC with a boolean rather than two, because the two
// answers are the same decision and a caller holding the id should not
// have to pick a method name to express which way it went.
message DecideRevisionRequest {
  string id = 1;
  bool accept = 2;
  string decided_by = 3;
}

message DecideRevisionResponse {
  SelfTaughtRecord artefact = 1;
}

message ArchiveArtefactRequest {
  string id = 1;
  string reason = 2;
}

message ArchiveArtefactResponse {}

message RestoreArtefactRequest {
  string id = 1;
}

message RestoreArtefactResponse {
  SelfTaughtRecord artefact = 1;
}

message ListArtefactHistoryRequest {
  string id = 1;
}

message ListArtefactHistoryResponse {
  // current is the version in force.
  SelfTaughtRecord current = 1;
  // history is the prior versions kept for rollback, newest first.
  repeated SelfTaughtRecord history = 2;
}

message RollbackArtefactRequest {
  string id = 1;
  uint32 version = 2;
  bool apply = 3;
}

message RollbackArtefactResponse {
  // artefact is what is now in force, or what would be with apply.
  SelfTaughtRecord artefact = 1;
  bool applied = 2;
}

// -----------------------------------------------------------------------------
// MemoryService — vector + episodic memory + retention + forget
// -----------------------------------------------------------------------------

service MemoryService {
  rpc Store(StoreRequest) returns (StoreResponse);
  rpc Recall(RecallRequest) returns (RecallResponse);
  rpc Search(SearchRequest) returns (SearchResponse);
  rpc EpisodicAdd(EpisodicAddRequest) returns (EpisodicAddResponse);
  rpc Dream(DreamRequest) returns (DreamResponse);
  rpc Forget(ForgetRequest) returns (ForgetResponse);
  // FindClusters — deterministic near-duplicate detection for the
  // Dream-time consolidation merge flow. Pure math (pairwise cosine
  // + union-find); no LLM. See docs/MEMORY.md for the composition
  // pattern with the Adjudicator LLM interface.
  // Reembed rewrites every episodic record's vector using the model
  // this node currently has loaded.
  //
  // ON THE NODE, THROUGH RAFT, deliberately. The offline
  // backfill-embeddings tool writes state.db directly, and the node
  // rebuilds state from its log on boot — so a PUT still in the log
  // re-applies and resurrects anything that tool deleted. Its writes
  // survived and its deletions did not, which meant a model change
  // could never fully land. Proposing the same mutations through raft
  // makes them durable, and costs nothing extra: the node already has
  // the embedder loaded and the log open.
  rpc Reembed(ReembedRequest) returns (ReembedResponse);
  rpc FindClusters(FindClustersRequest) returns (FindClustersResponse);
  // ListRecords browses the record buckets with the same filters
  // `lobslaw memory list` has always had. Read-only.
  //
  // Unscoped, like Recall beside it: every read on this service returns
  // whatever the store holds, and the listener it is registered on is
  // mTLS-only. That is a property of the whole service rather than a
  // decision taken here, and it is worth knowing before adding a
  // caller that is not an operator or a node.
  rpc ListRecords(ListRecordsRequest) returns (ListRecordsResponse);
  // GetRecord returns one record plus the consolidations that name it
  // among their sources — which is exactly what forgetting it would
  // take with it, and finding that out afterwards is too late.
  rpc GetRecord(GetRecordRequest) returns (GetRecordResponse);

  // ListConsolidations reads Dream's adjudication log: what it decided
  // about each cluster of near-duplicate memories, and why.
  //
  // Live because the offline form cannot run while the node is up —
  // bbolt holds an exclusive lock — and an audit trail readable only
  // by stopping the thing it audits is one nobody reads.
  rpc ListConsolidations(ListConsolidationsRequest) returns (ListConsolidationsResponse);

  // SetRecordVisibility shares or unshares records.
  //
  // The plan is computed on the server even for a dry run, so the
  // preview and the write see the same store. A client that planned
  // locally would be describing a state.db it cannot open while the
  // node is running.
  rpc SetRecordVisibility(SetRecordVisibilityRequest) returns (SetRecordVisibilityResponse);
}

message ListRecordsRequest {
  // "" or "all" | "vector" | "episodic". An unrecognised value is an
  // error rather than a silent "all": a mistyped kind that meant
  // everything would show records the caller asked to exclude.
  string kind = 1;
  string owner = 2;
  // scope only exists on vector records and tag only on episodic ones,
  // so either one excludes the other kind outright.
  string scope = 3;
  string tag = 4;
  // unowned selects records belonging to no principal, which is a
  // different question from an empty owner filter.
  bool unowned = 5;
  // limit caps each kind separately. The totals below are the counts
  // BEFORE the limit, so a truncated listing can say what it is not
  // showing rather than implying it is everything.
  int32 limit = 6;
}
message ListRecordsResponse {
  repeated VectorRecord vectors = 1;
  repeated EpisodicRecord episodics = 2;
  int32 vector_total = 3;
  int32 episodic_total = 4;
  int32 unowned = 5;
}

message GetRecordRequest {
  string id = 1;
}
message GetRecordResponse {
  // Exactly one of these is set. Both empty means no such record,
  // reported as NOT_FOUND rather than as an empty success.
  VectorRecord vector = 1;
  EpisodicRecord episodic = 2;
  repeated string referenced_by = 3;
}

// ListConsolidationsRequest filters a read of the adjudication log.
message ListConsolidationsRequest {
  // owner restricts to one principal's memories. Optional, and
  // unenforced: this service is reachable only by an operator
  // credential, which holds the unrestricted audience by design (see
  // the operator-role-and-cluster-authorization decision), the same
  // as ListRecords beside it. Should a non-operator caller ever reach
  // here, scoping becomes a requirement rather than a filter.
  string owner = 1;
  string verdict = 2; // merge | keep_distinct | conflict | supersedes
  int32 limit = 3;
  // since_seconds drops anything older. Seconds rather than a
  // timestamp so a caller can say "the last week" without agreeing a
  // clock with the server.
  int64 since_seconds = 4;
}

message ListConsolidationsResponse {
  repeated ConsolidationRecord consolidations = 1;
}

message SetRecordVisibilityRequest {
  repeated string ids = 1;
  Visibility visibility = 2;
  // apply writes. Without it the response is a plan and nothing
  // changes — the same dry-run-by-default the CLI has always had,
  // moved to where the records are.
  bool apply = 3;
}

// VisibilityChange is one record's before and after.
message VisibilityChange {
  string id = 1;
  string kind = 2; // vector | episodic
  string owner = 3;
  Visibility from = 4;
  Visibility to = 5;
  bool changed = 6;
}

message SetRecordVisibilityResponse {
  repeated VisibilityChange changes = 1;
  bool applied = 2;
  // error is set when a write failed partway. The changes list still
  // reports which records were written, because a gRPC error would
  // discard the response and leave the caller unable to tell what
  // landed — the worst possible answer for a command whose subject is
  // who can read a memory.
  string error = 3;
  // failed_id is the record the write stopped on.
  string failed_id = 4;
}

// Retention governs how long a memory record lives before it's a
// candidate for consolidation or pruning. Defined as a proto enum
// (rather than a free-form string) so writers can't accidentally
// emit "long" instead of "long-term" — the compiler binds the
// constant to the field. UNSPECIFIED defaults to EPISODIC at the
// service layer for legacy callers.
enum Retention {
  RETENTION_UNSPECIFIED = 0;
  RETENTION_SESSION = 1;
  RETENTION_EPISODIC = 2;
  RETENTION_LONG_TERM = 3;
}

message VectorRecord {
  string id = 1;
  repeated float embedding = 2;
  string text = 3;
  map<string, string> metadata = 4;
  string scope = 5;
  Retention retention = 6;
  repeated string source_ids = 7; // consolidation provenance
  google.protobuf.Timestamp created_at = 8;
  // owner is a principal reference — "user:alice", or "chat:telegram:-100"
  // for a record belonging to a shared conversation rather than a person.
  // Not the same thing as scope above, which is a category ("episodic").
  // Empty means a record written before ownership existed.
  string owner = 9;
  Visibility visibility = 10;
  // norm is the precomputed L2 norm of embedding. Derived state, written
  // by the FSM so no producer can forget it; a zero value means "not yet
  // computed" and readers fall back to computing it. Exists because
  // recomputing it per record per query was measurably wasteful on the
  // recall hot path.
  float norm = 11;
  // embedding_model names what produced `embedding` — the model
  // string exactly as configured, e.g. "qwen3-embedding-8b".
  //
  // Cosine between vectors from two different models is meaningless
  // even at identical width, and identical width is the COMMON case:
  // swap one 1536-dim model for another and every search silently
  // returns plausible, confidently-ranked nonsense. Mismatched WIDTHS
  // were already caught — vectorSearch skips and warns — so this
  // exists for the failure that had no signal at all.
  //
  // NOT proof of an identical vector space on its own: the same open
  // weights served by two hosts can differ in quantisation and
  // pooling. It catches the deliberate swap, which is the one that
  // actually happens. Empty means a record written before this field
  // existed, which readers treat as "unknown", never as "matches".
  string embedding_model = 12;
  // session_ref addresses the conversation this vector came from, as
  // "<channel>:<channel_id>" — the same value carried by the
  // EpisodicRecord it embeds, stamped here because the recall scan
  // reads vectors and never sees the episodic record until after it
  // has already chosen its candidates.
  //
  // Exists for shared conversations. In a channel several people can
  // read, "may this caller see this record" stops being answerable
  // from ownership alone: a memory the speaker owns is fair game, and
  // so is one this conversation produced, but one person's private
  // memory surfacing because somebody else spoke is a disclosure.
  // Empty means a record with no conversation origin — a scheduled
  // task, a commitment fire — which no conversation scope matches.
  string session_ref = 13;
}

// VectorScanEntry is a narrow VIEW over VectorRecord's wire format: the
// field numbers below are deliberately identical to VectorRecord's, so
// VectorRecord bytes unmarshal directly into this message. Combined with
// proto.UnmarshalOptions{DiscardUnknown: true}, the fields not listed
// here — notably text (3) and metadata (4) — are skipped without being
// decoded or retained.
//
// This exists for the recall scan, which reads only what it needs to
// filter and score. Decoding the full record for every candidate spent
// most of a query's time and allocation on text that was then discarded.
// Adding a field here is a deliberate act: it widens the hot path.
//
// INVARIANT: every field number must match VectorRecord exactly. A
// mismatch silently decodes the wrong data rather than failing, so it is
// covered by a test that marshals a VectorRecord and asserts the view
// round-trips the shared fields.
message VectorScanEntry {
  repeated float embedding = 2;
  string scope = 5;
  Retention retention = 6;
  string owner = 9;
  Visibility visibility = 10;
  float norm = 11;
  string session_ref = 13;
}

message EpisodicRecord {
  string id = 1;
  string event = 2;
  string context = 3;
  int32 importance = 4; // 1..10
  google.protobuf.Timestamp timestamp = 5;
  repeated string tags = 6;
  Retention retention = 7;
  repeated string source_ids = 8;
  string owner = 9;
  Visibility visibility = 10;
  // session_ref points at the transcript this was ingested from, as
  // "<channel>:<channel_id>:<seq>", so a recall hit can offer to read
  // the surrounding conversation. Advisory: the transcript is capped
  // and independently forgettable, so a stale pointer means the link
  // is dead, never that the memory is wrong.
  string session_ref = 11;
}

message StoreRequest {
  VectorRecord record = 1;
}
message StoreResponse {
  string id = 1;
}

message RecallRequest {
  string id = 1;
}
message RecallResponse {
  VectorRecord record = 1;
}

message SearchRequest {
  // Either embedding or text — server may call the embedding provider if text given.
  repeated float embedding = 1;
  string text = 2;
  int32 limit = 3;
  string scope_filter = 4;
  // RETENTION_UNSPECIFIED = no filter (matches all). Otherwise only
  // records with the matching retention are returned.
  Retention retention_filter = 5;
}
message SearchResponse {
  repeated VectorRecord hits = 1;
}

message EpisodicAddRequest {
  EpisodicRecord record = 1;
}
message EpisodicAddResponse {
  string id = 1;
}

message DreamRequest {}
message DreamResponse {
  int32 consolidated = 1;
  int32 pruned = 2;
}

message ForgetRequest {
  string query = 1;
  google.protobuf.Timestamp before = 2;
  repeated string tags = 3;
  // Explicit record IDs to forget. When non-empty, bypasses the
  // query/before/tags scan and deletes these IDs directly (with the
  // existing cascade-via-SourceIDs semantics). Lets clients compose
  // Search→preview→Forget pipelines without a dedicated "forget by
  // similarity" RPC. At least one of query/before/tags/ids must be
  // set — the handler still refuses to forget everything.
  repeated string ids = 4;
  // requester is the canonical principal the forget runs on behalf of
  // ("user:alice"). Records it may not read are not deleted — forget
  // is destructive and irreversible, so an unscoped one lets any
  // caller erase another person's memory.
  //
  // Empty means unrestricted, for operator tooling and peer nodes
  // reaching this over mTLS. The agent's memory_forget always sets it
  // from the turn.
  string requester = 5;
  // dry_run resolves the blast radius and writes nothing.
  //
  // `lobslaw memory forget` has always been a dry run unless --apply,
  // and the live form must not be the one that deletes on the first
  // try. Forget is irreversible: it cascades through SourceIds, so
  // "just run it and see" is not available.
  bool dry_run = 6;
}
message ForgetResponse {
  int32 records_removed = 1;
  // Named "reforged" historically; these consolidations are DELETED,
  // because keeping a summary whose sources are gone leaks the deleted
  // content through the summary's own text and embedding.
  int32 consolidations_reforged = 2;
  // The resolved plan, populated on a dry run and on a real one alike.
  repeated string matched = 3;
  repeated string swept = 4;
  // missing are requested ids that exist in neither record bucket.
  // Reported rather than silently dropped: for a hand-typed id, "no
  // such record" is nearly always a typo, and a forget that quietly
  // deletes nothing is the worst outcome.
  repeated string missing = 5;
}

// FindClusters groups near-duplicate VectorRecords for the Dream-
// time merge flow. O(n²) pairwise cosine over the vector bucket,
// union-find connected components. Intentionally no LLM — the
// Adjudicator (LLM layer) takes the clusters and decides what to
// do with each. Scope and retention filters keep ephemeral session
// records out of the long-term merge path.
message ReembedRequest {
  // limit caps how many records are processed, for a trial run on a
  // large corpus. Zero means all of them.
  int32 limit = 1;
}

message ReembedResponse {
  // reembedded is how many episodic records now have a current vector.
  int32 reembedded = 1;
  // replaced is how many superseded vectors were deleted.
  int32 replaced = 2;
  // orphans is how many vectors carrying a DIFFERENT model's stamp
  // were removed. Those belong to no episodic record — a consolidation
  // whose sources were pruned, or a row from an interrupted run — so
  // nothing else would ever revisit them, and one is enough to make
  // the boot guard refuse.
  int32 orphans = 3;
  // unreadable is how many records could not be decrypted and were
  // skipped. Non-zero means the store holds more than one key
  // generation; those records will never be recalled.
  int32 unreadable = 4;
  // model is the identity stamped on every vector written.
  string model = 5;
  // consolidations is how many of dream's summaries were re-embedded.
  // Their text is dream's and is carried through untouched; only the
  // vector is rewritten. Non-zero on the first run after an embedder
  // is configured, because dream writes a summary with a NIL embedding
  // when there is none — searchable by nothing until this repairs it.
  int32 consolidations = 6;
}

message FindClustersRequest {
  float threshold = 1; // minimum pairwise cosine, e.g. 0.88
  int32 min_cluster_size = 2; // default 2 (skip singletons)
  int32 max_cluster_size = 3; // default 10 (split giant CCs)
  string scope_filter = 4; // only records in this scope
  Retention retention_filter = 5;
  google.protobuf.Timestamp before = 6;
  int32 limit = 7; // cap returned cluster count
}
message FindClustersResponse {
  repeated Cluster clusters = 1;
}
message Cluster {
  string id = 1; // stable hash of sorted member IDs
  repeated VectorRecord records = 2;
  float min_similarity = 3; // worst pairwise within cluster
  float avg_similarity = 4;
}

// ConsolidationRecord is one adjudication Dream made about a cluster
// of near-duplicate memories: what it decided, why, and to what.
//
// Memory that silently rewrites itself and cannot be inspected is a
// trust problem for a privacy-first product. The verdict and reason
// were already computed on every run and then written to a log line
// and forgotten — so a user asking "why did it merge those two notes"
// had no answer, and one asking "what has it been doing" had none
// either.
//
// Kept even for KEEP_DISTINCT. "Why did it NOT merge these" is asked
// as often as the opposite, and a log that only records changes
// cannot answer it.
message ConsolidationRecord {
  string id = 1;
  string cluster_id = 2;
  // verdict mirrors MergeVerdict: "merge" | "keep_distinct" |
  // "conflict" | "supersedes". A string rather than an enum because
  // the adjudicator is pluggable and a new implementation adding a
  // verdict should not need a proto change to be able to explain
  // itself.
  string verdict = 3;
  string reason = 4;
  // source_ids are the records the decision was about. Retained even
  // when they were merged away, so the log still names what went into
  // a consolidation after the originals are gone.
  repeated string source_ids = 5;
  // result_id is the consolidated record for a merge, or the tag
  // applied for conflict/supersedes. Empty for keep_distinct.
  string result_id = 6;
  int32 member_count = 7;
  float avg_similarity = 8;
  // owner scopes reads the same way the records themselves are
  // scoped. A consolidation log that leaked across owners would
  // describe one person's memories to another.
  string owner = 9;
  google.protobuf.Timestamp created_at = 10;
  // applied is false when the verdict was decided but the write
  // failed. Recording the attempt matters: a merge that was chosen
  // and then errored is exactly the case where a user notices
  // something is wrong and needs the log to say so.
  bool applied = 11;
  // error carries why, when applied is false.
  string error = 12;
}

// -----------------------------------------------------------------------------
// PolicyService — RBAC, risk tiers, confirmation
// -----------------------------------------------------------------------------

service PolicyService {
  rpc Evaluate(EvaluateRequest) returns (EvaluateResponse);
  rpc SyncRules(SyncRulesRequest) returns (SyncRulesResponse);
  rpc AddRule(AddRuleRequest) returns (AddRuleResponse);
  // RevokeApprovalRules deletes rules minted by an "always" approval.
  //
  // Scoped to that class in its NAME rather than by a prefix the
  // caller supplies. The guarantee an operator relies on — that
  // revoking their approvals cannot touch a rule they wrote by hand —
  // is enforced on the server, because a check in the client is one an
  // attacker replaces.
  //
  // There is deliberately no unscoped delete. Nothing needs one, and
  // an RPC that can remove any policy rule is the one you would most
  // like not to have shipped.
  rpc RevokeApprovalRules(RevokeApprovalRulesRequest) returns (RevokeApprovalRulesResponse);
  rpc RequestConfirmation(RequestConfirmationRequest) returns (RequestConfirmationResponse);

  // ListSessionGrants and RevokeSessionGrants are the other half of
  // "approved for the rest of this conversation".
  //
  // The permanent tier has had `lobslaw policy approvals` /
  // `revoke-approvals` since it shipped, on the argument that without
  // a way to see and undo a grant, "revocable" is a claim in a doc.
  // The conversation tier had neither: the only way to undo one was
  // /new, which also destroys the transcript, and there was no way at
  // all to see what a conversation had already agreed to.
  //
  // That is the wrong way round. The permanent grant is the one
  // somebody thought hardest about; the conversation grant is the one
  // given casually, mid-task, to get on with something — and it is the
  // one with no surface.
  rpc ListSessionGrants(ListSessionGrantsRequest) returns (ListSessionGrantsResponse);
  rpc RevokeSessionGrants(RevokeSessionGrantsRequest) returns (RevokeSessionGrantsResponse);
}

message ListSessionGrantsRequest {
  // session_id narrows to one conversation, "<channel>:<channel_id>".
  // Empty lists every conversation's.
  string session_id = 1;
}
message ListSessionGrantsResponse {
  repeated SessionGrant grants = 1;
  // ttl_seconds is what a grant is given when recorded, so a listing
  // can say how long the ones it is showing have left rather than
  // making the reader look it up.
  int64 ttl_seconds = 2;
}

message RevokeSessionGrantsRequest {
  // Exactly one of ids or session_id. Both empty is an error, for the
  // same reason RevokeApprovalRules refuses it: nobody should revoke a
  // set by omitting an argument.
  repeated string ids = 1;
  // session_id revokes everything one conversation has agreed to,
  // WITHOUT touching its transcript. That separation is the point —
  // /new does both, and "I regret that approval" is not the same
  // request as "forget what we discussed".
  string session_id = 2;
  bool dry_run = 3;
}
message RevokeSessionGrantsResponse {
  repeated string revoked = 1;
  repeated string not_found = 2;
}

message PolicyRule {
  string id = 1;
  string subject = 2; // user:alice, role:admin, node:memory-1
  string action = 3; // memory:read, tool:exec, storage:write
  string resource = 4; // /path, memory:*, service:*
  string effect = 5; // "allow" | "deny" | "require_confirmation"
  repeated Condition conditions = 6;
  int32 priority = 7;
  string scope = 8;
  // created_by records where a rule came from. Operator-authored rules
  // leave it empty; a rule minted by an "always" approval carries
  // "approval:<prompt_id>".
  //
  // Provenance is what stops "always" being a decision the user can
  // never see again: it makes listing and revoking approval-derived
  // rules a single command, rather than asking someone to recognise
  // their own past taps in an undifferentiated rule list.
  string created_by = 9;
  google.protobuf.Timestamp created_at = 10;
}

message Condition {
  string key = 1; // "time_of_day" | "peer_cidr" | ...
  string op = 2; // "in" | "between" | "eq"
  string value = 3;
}

message Claims {
  string user_id = 1;
  repeated string roles = 2;
  google.protobuf.Timestamp expires_at = 3;
  google.protobuf.Timestamp issued_at = 4;
  string issuer = 5;
  string audience = 6;
  string scope = 7;
}

message EvaluateRequest {
  Claims claims = 1;
  string action = 2;
  string resource = 3;
}
message EvaluateResponse {
  string effect = 1; // "allow" | "deny" | "require_confirmation"
  string rule_id = 2; // id of the matching rule (or "" for default-deny)
  string reason = 3;
}

message SyncRulesRequest {}
message SyncRulesResponse {
  repeated PolicyRule rules = 1;
}

message AddRuleRequest {
  PolicyRule rule = 1;
}
message AddRuleResponse {
  string id = 1;
}

message RevokeApprovalRulesRequest {
  // Ids to revoke. Empty with all=false is an error, so that nobody
  // revokes the whole set by omitting an argument.
  repeated string ids = 1;
  // Revoke every approval-minted rule. Must be set explicitly.
  bool all = 2;
  // Report what would happen without writing anything.
  bool dry_run = 3;
}
message RevokeApprovalRulesResponse {
  repeated string revoked = 1;
  // refused carries ids that exist but were NOT minted by an approval
  // — reported rather than skipped, because silently ignoring them
  // lets somebody believe they revoked something they did not.
  repeated string refused = 2;
  // not_found is kept separate: a typo and a protected rule are
  // different mistakes with different fixes.
  repeated string not_found = 3;
}

message RequestConfirmationRequest {
  string user = 1;
  string question = 2;
  repeated string options = 3;
  google.protobuf.Duration timeout = 4;
  string originating_channel = 5; // which channel to deliver the prompt on
}
message RequestConfirmationResponse {
  bool approved = 1;
  string chosen_option = 2;
  bool timed_out = 3;
}

// -----------------------------------------------------------------------------
// PlanService — the "what's your plan today?" surface
// -----------------------------------------------------------------------------

service PlanService {
  rpc GetPlan(GetPlanRequest) returns (GetPlanResponse);
  rpc AddCommitment(AddCommitmentRequest) returns (AddCommitmentResponse);
  rpc CancelCommitment(CancelCommitmentRequest) returns (CancelCommitmentResponse);
}

message AgentCommitment {
  string id = 1;
  google.protobuf.Timestamp due_at = 2;
  string trigger = 3; // "time" | "event:xxx"
  string reason = 4;
  string created_from_turn = 5;
  string created_for = 6;
  string status = 7; // "pending" | "done" | "cancelled"
  string handler_ref = 8;
  map<string, string> params = 9;
  // Raft-CAS claim for cluster-wide singleton execution. See
  // lobslaw-cluster-claim decision for semantics: whoever CASes the
  // claim first wins and the rest skip. Expired claims are treated
  // as unclaimed.
  string claimed_by = 10;
  google.protobuf.Timestamp claim_expires_at = 11;
  // owner is the canonical principal this commitment belongs to
  // ("user:alice"). created_for above is the raw channel id it was
  // made for, which is per-channel and so cannot be compared across
  // them. Empty on records written before ownership existed.
  string owner = 12;
  // revision — see ScheduledTaskRecord.revision.
  uint64 revision = 13;
}

message ScheduledTaskRecord {
  string id = 1;
  string name = 2;
  string schedule = 3; // cron expression
  string handler_ref = 4;
  map<string, string> params = 5;
  bool enabled = 6;
  string created_by = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp last_run = 9;
  google.protobuf.Timestamp next_run = 10;
  // Raft-CAS claim, same semantics as AgentCommitment.claimed_by.
  string claimed_by = 11;
  google.protobuf.Timestamp claim_expires_at = 12;
  // owner is the canonical principal, as on AgentCommitment.
  // created_by above is the raw channel id.
  string owner = 13;
  // revision is assigned by the FSM and bumped on every write to this
  // record. Conditional writes carry the revision they read and are
  // rejected if it has moved. See LogEntry.expected_revision.
  uint64 revision = 14;
}

message InFlightWork {
  string id = 1;
  string goal = 2;
  google.protobuf.Timestamp last_progress = 3;
  string status = 4;
  repeated string blockers = 5;
}

message CheckBack {
  string id = 1;
  string original_request = 2;
  google.protobuf.Timestamp scheduled_for = 3;
}

message GetPlanRequest {
  google.protobuf.Duration window = 1;
  string scope = 2;
}
message GetPlanResponse {
  google.protobuf.Duration window = 1;
  repeated AgentCommitment commitments = 2;
  repeated ScheduledTaskRecord scheduled_tasks = 3;
  repeated InFlightWork in_flight = 4;
  repeated CheckBack check_back_threads = 5;
}

message AddCommitmentRequest {
  AgentCommitment commitment = 1;
}
message AddCommitmentResponse {
  string id = 1;
}

message CancelCommitmentRequest {
  string id = 1;
}
message CancelCommitmentResponse {}

// -----------------------------------------------------------------------------
// AuditService — hash-chained tamper-evident log
// -----------------------------------------------------------------------------

service AuditService {
  rpc Append(AppendRequest) returns (AppendResponse);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc VerifyChain(VerifyChainRequest) returns (VerifyChainResponse);
}

message AuditEntry {
  string id = 1;
  google.protobuf.Timestamp timestamp = 2;
  string actor_scope = 3;
  string action = 4;
  string target = 5;
  repeated string argv = 6;
  string policy_rule = 7;
  string effect = 8;
  string result_hash = 9;
  string prev_hash = 10;
}

message AppendRequest {
  AuditEntry entry = 1;
}
message AppendResponse {
  string id = 1;
}

message QueryRequest {
  string actor_scope = 1;
  string action = 2;
  string target = 3;
  google.protobuf.Timestamp since = 4;
  google.protobuf.Timestamp until = 5;
  int32 limit = 6;
  string sink = 7; // "" | "raft" | "local"
}
message QueryResponse {
  repeated AuditEntry entries = 1;
}

message VerifyChainRequest {
  string sink = 1; // "" | "raft" | "local"
}
message VerifyChainResponse {
  bool ok = 1;
  string first_break_id = 2; // empty on success
  int64 entries_checked = 3;
}

// -----------------------------------------------------------------------------
// StorageService — cluster-wide mount config
// -----------------------------------------------------------------------------

service StorageService {
  rpc AddMount(AddMountRequest) returns (AddMountResponse);
  rpc RemoveMount(RemoveMountRequest) returns (RemoveMountResponse);
  rpc ListMounts(ListMountsRequest) returns (ListMountsResponse);
}

message StorageMount {
  string label = 1;
  string type = 2; // "local" | "nfs" | "rclone"
  string path = 3; // local: absolute path; nfs/rclone: backend-specific
  string server = 4; // nfs: server hostname
  string export = 5; // nfs: export path
  string remote = 6; // rclone: remote name
  string bucket = 7; // rclone: bucket (for object stores)
  bool crypt = 8; // rclone: enable crypt
  map<string, string> options = 9; // backend-specific (access_key_ref etc)
  google.protobuf.Duration poll_interval = 10;
}

message AddMountRequest {
  StorageMount mount = 1;
}
message AddMountResponse {}

message RemoveMountRequest {
  string label = 1;
}
message RemoveMountResponse {}

message ListMountsRequest {}
message ListMountsResponse {
  repeated StorageMount mounts = 1;
}

// ChannelStateRecord is a generic per-channel raft-replicated key-value
// pair. Used by gateway channels to persist resume state across
// restarts (Telegram update offset, REST cursors, webhook last-seen
// timestamps). The bbolt key is "<channel>:<key>"; that lets a single
// bucket hold every channel's state without a per-channel bucket
// proliferation. Value is opaque bytes — the channel handler chooses
// the encoding (typically just decimal int64 for offsets, JSON for
// richer state).
message ChannelStateRecord {
  string channel = 1; // "telegram" | "rest" | "webhook" | future channels
  string key = 2; // channel-defined key, e.g. "offset", "last_seen"
  bytes value = 3; // opaque bytes
  google.protobuf.Timestamp updated_at = 4;
}

// SoulTuneRecord holds the agent's mutable personality overlay.
// SOUL.md on disk is the operator-curated baseline (read-only); this
// record carries the bounded subset the agent may tune at runtime —
// name, the five emotive dimensions, emoji_usage, fragments. Stored
// in raft so cluster nodes agree on the agent's identity and so
// containerised deployments don't need a writable file mount.
//
// One record per cluster, keyed by the constant id "soul:tune". A
// per-field optional discriminator means an unset field falls back
// to the baseline at merge time — so when the operator edits SOUL.md
// to lower sarcasm, untuned dimensions follow the new baseline while
// fields the agent has explicitly tuned stay pinned.
message SoulTuneRecord {
  // Latest applied tune.
  SoulTuneState current = 1;
  // Past tunes for HistoryRollback. Oldest first; capped at 20.
  repeated SoulTuneState history = 2;
}

message SoulTuneState {
  optional string name = 1;
  EmotiveStyleTune emotive_style = 2;
  // fragments_set discriminates "no fragment edits" from "explicitly
  // empty fragment list" — the latter is the user clearing memory.
  bool fragments_set = 3;
  repeated string fragments = 4;
  google.protobuf.Timestamp updated_at = 5;
  // updated_by carries the subject that proposed the change ("scope:owner",
  // "user:alice"). Audit trail; not used for policy decisions.
  string updated_by = 6;
}

message EmotiveStyleTune {
  optional int32 excitement = 1;
  optional int32 formality = 2;
  optional int32 directness = 3;
  optional int32 sarcasm = 4;
  optional int32 humor = 5;
  optional string emoji_usage = 6;
}

// CredentialRecord holds an OAuth (or other-provider) credential
// the operator has connected to lobslaw. Tokens are encrypted at
// rest with the cluster MemoryKey — the bytes on the wire and on
// disk are ciphertext. Decryption happens only inside the
// CredentialService when handing tokens to skill subprocesses.
//
// One record per (provider, subject) tuple. ID is a ULID for
// stable referencing; bucket key is "<provider>:<subject>" for
// human-debuggable lookup.
//
// AllowedSkills + AllowedScopesPerSkill are populated only by
// operator CLI / chat commands ("credentials_grant"). New records
// from oauth_start arrive with empty ACL — they're inert until
// explicitly granted to a skill. This is the trust gate.
message CredentialRecord {
  string id = 1;
  string provider = 2; // "google" | "github" | "openai-managed" | ...
  string subject = 3; // user@example.com — the entity authenticated
  bytes access_token = 4; // encrypted with cluster MemoryKey
  bytes refresh_token = 5; // encrypted with cluster MemoryKey
  repeated string scopes = 6; // OAuth scopes granted on first authorize
  google.protobuf.Timestamp expires_at = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp last_rotated = 9;
  google.protobuf.Timestamp last_used = 10;

  // ACL fields — operator-controlled.
  repeated string allowed_skills = 11;
  // Per-skill scope subset. Each entry is "skill:scope1,scope2,..."
  // (ASCII, no nested message because protobuf maps with repeated
  // values are a syntactic dead-end). Parsed by the credential
  // service into the in-memory ACL.
  map<string, AllowedScopes> allowed_scopes_per_skill = 12;
}

message AllowedScopes {
  repeated string scopes = 1;
}

// UserPreferences holds per-user settings that aren't credentials:
// timezone, subscribed channel addresses, language. Plaintext —
// channel IDs aren't secret. Solo deployments use one record (id =
// "owner"); team / corporate deployments scale by adding records.
//
// channels is the list of channel-specific addresses the
// notification service uses to broadcast messages to this user.
// Inbound messages on any channel use the OriginatorChannel hint
// instead — broadcast is only for self-generated notifications
// (commitments, scheduled tasks, async research completions).
message UserPreferences {
  string user_id = 1; // canonical id; bucket key
  string display_name = 2; // human-readable, e.g. "Alice"
  string timezone = 3; // IANA name; "Europe/London", "America/Los_Angeles". Empty falls back to cluster default.
  string language = 4; // BCP-47, e.g. "en", "en-GB". Empty = cluster default.
  repeated UserChannelAddress channels = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
}

// PinnedMemory is the always-on block: facts that must never be
// missed, injected in the system prompt every turn rather than
// retrieved.
//
// The archive plus per-turn recall means a vector miss on "prefers
// terse replies" makes the turn behave as though it were never said.
// Some things cannot be subject to a retrieval hit.
//
// Two kinds, kept in separate records rather than one blob: the user
// profile is about a person and the agent notes are about an
// environment, they are edited by different parties for different
// reasons, and one overflowing should not squeeze the other.
message PinnedMemory {
  // id is "profile:<user_id>" or "notes:<user_id>". The kind is in
  // the key so a listing is self-describing and a bad key cannot
  // silently become the other kind.
  string id = 1;
  string user_id = 2;
  // kind is "profile" | "notes".
  string kind = 3;
  // entries are delimiter-separated and multiline, edited by unique
  // substring match rather than by id. An id-addressed store would
  // mean the model has to read an index before it can edit anything,
  // which costs a round trip to change one line.
  repeated string entries = 4;
  google.protobuf.Timestamp updated_at = 5;
  // revision supports CAS, so two turns editing at once cannot
  // silently drop one another's writes.
  uint64 revision = 6;
  string claimed_by = 7;
}

// -----------------------------------------------------------------------------
// Self-taught artefacts
// -----------------------------------------------------------------------------
//
// Provenance by LOCATION rather than by tag. If a record is in this
// bucket, the agent authored it — there is no marker to forget, forge,
// or lose, "forget everything you taught yourself" is one operation,
// and a curator restricted to agent-written artefacts has that
// invariant structurally rather than as a rule it must remember.
//
// The boundary is behaviour: an episodic record is data the model MAY
// retrieve and weigh; a skill or a pinned entry is an instruction it
// FOLLOWS. Those deserve different custody.

enum SelfTaughtKind {
  SELF_TAUGHT_KIND_UNSPECIFIED = 0;
  SELF_TAUGHT_KIND_SKILL = 1;
  SELF_TAUGHT_KIND_PROCEDURE = 2;
  SELF_TAUGHT_KIND_PINNED_PROPOSAL = 3;
}

enum SelfTaughtOrigin {
  SELF_TAUGHT_ORIGIN_UNSPECIFIED = 0;
  // REVIEW_FORK is the agent deciding on its own, after a turn.
  SELF_TAUGHT_ORIGIN_REVIEW_FORK = 1;
  // USER_DIRECTED is somebody asking it to remember how to do this.
  SELF_TAUGHT_ORIGIN_USER_DIRECTED = 2;
}

enum SelfTaughtState {
  SELF_TAUGHT_STATE_UNSPECIFIED = 0;
  // PROPOSED artefacts are inert. They do not load until approved.
  SELF_TAUGHT_STATE_PROPOSED = 1;
  SELF_TAUGHT_STATE_ACTIVE = 2;
  // STALE is unused-and-aging, a candidate for archiving.
  SELF_TAUGHT_STATE_STALE = 3;
  // ARCHIVED artefacts are recoverable. Deletion is not a lifecycle
  // transition: for a product whose pitch is trust, an agent that can
  // silently erase evidence of what it taught itself is the wrong
  // default.
  SELF_TAUGHT_STATE_ARCHIVED = 4;
}

message SelfTaughtRecord {
  string id = 1;
  SelfTaughtKind kind = 2;
  string name = 3;
  string body = 4;
  // files maps a relative path to its content — references/… for a
  // skill. Held in the record rather than on a mount so the artefact
  // is one atomic thing to approve, archive, or discard.
  map<string, string> files = 5;
  SelfTaughtOrigin origin = 6;
  // turn_id and session_id say what taught it, for audit correlation.
  string turn_id = 7;
  string session_id = 8;
  SelfTaughtState state = 9;
  // pinned opts an artefact out of every automatic transition. A
  // person who has decided something is worth keeping should not have
  // to defend it from the curator every fortnight.
  bool pinned = 10;
  uint32 version = 11;
  google.protobuf.Timestamp created_at = 12;
  google.protobuf.Timestamp updated_at = 13;
  // owner scopes reads, as everywhere else.
  string owner = 14;
  // approved_by and approved_at record who let it out of PROPOSED.
  string approved_by = 15;
  google.protobuf.Timestamp approved_at = 16;
  // archived_reason survives the transition, so a listing of the
  // archive says why each thing is in it.
  string archived_reason = 17;
  uint64 revision = 18;
  string claimed_by = 19;

  // pending is a proposed refinement awaiting approval.
  //
  // Separate from the fields above so an approved artefact KEEPS
  // WORKING while a refinement waits. Overwriting the body and
  // knocking the state back to PROPOSED would take a skill that has
  // been used successfully for a month out of service because the
  // agent had an idea about improving it.
  PendingRevision pending = 20;

  // embedding indexes name + description + body for the
  // near-duplicate search that runs before a new artefact is
  // accepted. Empty when no embedder is wired; the search falls back
  // to lexical scoring, which still catches the common case of a
  // near-identical name.
  repeated float embedding = 21;

  // description is the one-line summary the similarity check and any
  // future index render. Distinct from body, which is the whole
  // instruction.
  string description = 22;
}

// PendingRevision is a refinement that has been proposed against an
// existing artefact and not yet approved.
message PendingRevision {
  string body = 1;
  map<string, string> files = 2;
  string description = 3;
  // turn_id is what proposed it, for audit correlation.
  string turn_id = 4;
  // rationale is why the proposer thinks this is better. Required in
  // practice: a diff with no reasoning is a diff nobody can approve
  // with any confidence.
  string rationale = 5;
  google.protobuf.Timestamp proposed_at = 6;
}

// SelfTaughtUsage is the telemetry that R17's staleness transitions
// need.
//
// A bucket rather than a sidecar file, for reasons stronger than
// tidiness: counters inside a manifest would invalidate its digest and
// break verification, a per-node file is invisible to peers so every
// node but one would compute staleness from partial data, and the FSM
// already provides the atomicity a sidecar needs locking for.
message SelfTaughtUsage {
  string id = 1;
  uint64 invocations = 2;
  google.protobuf.Timestamp last_used_at = 3;
  google.protobuf.Timestamp first_used_at = 4;
}

// UserChannelAddress is one channel binding for a user. type is the
// gateway channel kind ("telegram", "rest", "slack" — matches the
// Sink registration); address is channel-specific (Telegram chat_id
// as string, Slack member id, etc.).
message UserChannelAddress {
  string type = 1;
  string address = 2;
}

// -----------------------------------------------------------------------------
// Conversation sessions
// -----------------------------------------------------------------------------
//
// A session is the durable transcript of one conversation on one channel.
// Distinct from episodic memory: episodic records are what the agent chose
// to REMEMBER (scored, consolidated, forgettable); a session is the raw
// message thread the agent needs to REPLAY to keep talking coherently.
//
// Storage layout: SessionRecord is the metadata/index record, one per
// session, keyed "<channel>:<channel_id>". Messages are separate records
// in their own bucket keyed "<session_id>:<20-digit zero-padded seq>" so
// bbolt's byte ordering is also sequence ordering and a session's thread
// is a prefix scan. Keeping messages out of the index record means a turn
// appends O(new messages) bytes to the raft log rather than rewriting the
// whole transcript.

// SessionRecord is the per-session index. Message bodies live in
// BucketSessionMessages; this record tracks the cursor bounds so a
// reader knows the retained range without scanning.
// EnrolmentService issues an operator credential to a key the
// requester already holds.
//
// The problem it solves: `cluster export-operator` generates the
// keypair centrally and hands over both halves, so the PRIVATE KEY has
// to travel — over scp, a USB stick, or worse, a chat channel where it
// lands in a message store, a phone backup, and this cluster's own
// transcripts.
//
// Here the key never moves. The laptop generates it, keeps the private
// half, and sends a CSR. A certificate signing request and a
// certificate are both public; they can cross any channel.
//
// Submit and Poll are served WITHOUT a client certificate — a laptop
// enrolling does not have one yet, which is the entire point. They are
// therefore on their own listener, and they are the only two RPCs on
// it. List and Decide require an operator credential and live on the
// cluster listener with everything else.
service EnrolmentService {
  rpc SubmitEnrolment(SubmitEnrolmentRequest) returns (SubmitEnrolmentResponse);
  rpc PollEnrolment(PollEnrolmentRequest) returns (PollEnrolmentResponse);
  rpc ListEnrolments(ListEnrolmentsRequest) returns (ListEnrolmentsResponse);
  rpc DecideEnrolment(DecideEnrolmentRequest) returns (DecideEnrolmentResponse);
}

enum EnrolmentState {
  ENROLMENT_STATE_UNSPECIFIED = 0;
  ENROLMENT_STATE_PENDING = 1;
  ENROLMENT_STATE_ISSUED = 2;
  ENROLMENT_STATE_DENIED = 3;
  // Reached by the sweeper. A request nobody answered must not stay
  // approvable forever — an operator returning to a week-old prompt
  // has no idea whether the laptop that asked is still the one they
  // would be admitting.
  ENROLMENT_STATE_EXPIRED = 4;
}

message EnrolmentRecord {
  string id = 1;
  // requested_name is what the laptop asked to be called. It is NOT
  // what ends up in the certificate unless an approver agrees to it:
  // a request is attacker-shaped input and its subject is whatever the
  // requester typed.
  string requested_name = 2;
  // csr_der is the DER-encoded PKCS#10 request. Public.
  bytes csr_der = 3;
  // fingerprint is SHA-256 of the public key, formatted for a human to
  // compare. This is what an approver checks against what the laptop
  // printed, and it is the only defence against approving somebody
  // else's request that arrived at the same moment.
  string fingerprint = 4;
  EnrolmentState state = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp expires_at = 7;
  // decided_by is the principal who approved or denied, for audit.
  string decided_by = 8;
  google.protobuf.Timestamp decided_at = 9;
  // issued_name is the name actually certified, which the approver
  // chose. Usually the requested one; recorded separately so the
  // difference is visible when it is not.
  string issued_name = 10;
  // cert_pem is the issued certificate. Public — a certificate is not
  // a secret, and without the private half it is useless.
  bytes cert_pem = 11;
  // prompt_id links to the confirmation raised for this request, so a
  // channel answer and a CLI answer resolve the same thing.
  string prompt_id = 12;

  // claimed_by and revision drive the same compare-and-set the prompt
  // store uses. Two approvers answering at once must not both issue a
  // certificate — the second read is stale and its apply is refused.
  string claimed_by = 13;
  uint64 revision = 14;
}

message SubmitEnrolmentRequest {
  string requested_name = 1;
  bytes csr_der = 2;
}
message SubmitEnrolmentResponse {
  string id = 1;
  // fingerprint is echoed so the laptop can print the same string the
  // approver will see. If they differ, something is between them.
  string fingerprint = 2;
  google.protobuf.Timestamp expires_at = 3;
}

message PollEnrolmentRequest {
  string id = 1;
}
message PollEnrolmentResponse {
  EnrolmentState state = 1;
  bytes cert_pem = 2;
  // ca_pem is the OPERATOR root, which the laptop needs in order to
  // present a chain the node will accept.
  bytes ca_pem = 3;
  // cluster_ca_pem is what the laptop verifies the NODE against on
  // every later connection.
  bytes cluster_ca_pem = 4;
  string issued_name = 5;
}

message ListEnrolmentsRequest {
  // pending_only narrows to what still needs an answer.
  bool pending_only = 1;
}
message ListEnrolmentsResponse {
  repeated EnrolmentRecord enrolments = 1;
}

message DecideEnrolmentRequest {
  string id = 1;
  bool approve = 2;
  // name overrides the requested one. Empty accepts what was asked
  // for.
  string name = 3;
  // fingerprint, when set, must match the record's. A caller who has
  // verified a fingerprint out of band can pin it here, so a request
  // replaced between reading and approving is refused rather than
  // silently approved in place of the one they checked.
  string fingerprint = 4;
  // valid_for overrides the default certificate lifetime.
  google.protobuf.Duration valid_for = 5;
}
message DecideEnrolmentResponse {
  EnrolmentRecord enrolment = 1;
}

// TraceService reads this node's turn traces.
//
// Traces are per-node FILES, deliberately: R24 kept them out of raft
// so a trace never costs a replicated write. That decision stands, and
// this service does not undo it — it lets an operator ask a SPECIFIC
// node for what it recorded, rather than reading whatever directory
// happens to be on their laptop.
//
// Every response carries node_id. A turn served elsewhere was traced
// elsewhere, and a trace listing that does not say whose it is invites
// exactly the wrong conclusion.
//
// NO SPAN CARRIES CONTENT. Names, sizes, counts, timings and outcomes
// only — no message text, no tool arguments, no tool output. That is a
// property of the Span type this mirrors, and putting it on the wire
// must not become the place it is quietly relaxed.
service TraceService {
  rpc ListTurns(ListTurnsRequest) returns (ListTurnsResponse);
  rpc ReadTurn(ReadTurnRequest) returns (ReadTurnResponse);
}

message ListTurnsRequest {
  int32 limit = 1;
}
message ListTurnsResponse {
  // node_id is which node answered. Traces are per-node, so a listing
  // without it is unattributable.
  string node_id = 1;
  // Newest first.
  repeated string turn_ids = 2;
  // enabled distinguishes a node with tracing OFF from one that has
  // served no turns. Both return nothing and they are different
  // answers — only one of them is fixed by editing config.
  bool enabled = 3;
}

message ReadTurnRequest {
  string turn_id = 1;
}
message ReadTurnResponse {
  string node_id = 1;
  repeated TraceSpan spans = 2;
  bool enabled = 3;
}

// TraceSpan is one measured piece of a turn.
//
// Mirrors internal/trace.Span field for field. Nothing here is content:
// name is a model or tool NAME, result_bytes is a SIZE, and error is a
// status plus a classification rather than a response body.
message TraceSpan {
  string turn_id = 1;
  string span_id = 2;
  string parent_id = 3;
  string kind = 4;
  // The model or tool name. A name, never an argument.
  string name = 5;
  string provider = 6;
  google.protobuf.Timestamp started_at = 7;
  int64 duration_ns = 8;
  string outcome = 9;
  int32 prompt_tokens = 10;
  int32 completion_tokens = 11;
  // The prompt subset served from cache, separate because it is priced
  // differently and folding it in would overstate every cached turn.
  int32 cached_tokens = 12;
  double cost_usd = 13;
  // A SIZE, not a body.
  int32 result_bytes = 14;
  // unit and quantity carry billing not denominated in tokens — video
  // seconds, images, credits. A zero token count on a call that cost
  // real money reads as a free call.
  string unit = 15;
  double quantity = 16;
  // billed_to distinguishes drawing on a prepaid plan from spending
  // against a balance. Without it a plan-billed call is
  // indistinguishable from a free one.
  string billed_to = 17;
  // A status and a classification, never a response body.
  string error = 18;
  // Position in a failover chain, 0-based. What makes "my primary is
  // never used" answerable.
  int32 attempt = 19;
}

// IdentityService repoints a principal after a channel rebinding.
//
// One operation, deliberately. This is a migration, not an identity
// API: it exists because a person's channel id can change (a new
// Telegram account, a renamed handle) and everything they own is keyed
// by the old one.
service IdentityService {
  rpc Rebind(RebindRequest) returns (RebindResponse);
}

message RebindRequest {
  // Bare ids, as they appear in claims.UserID — "tg-@alice", not
  // "user:tg-@alice". The principal prefix is added where records use
  // it, because both spellings have been written into owner fields
  // over this project's life.
  string from = 1;
  string to = 2;
  // dry_run resolves what would change and writes nothing. The
  // default, because this rewrites ownership across seven buckets and
  // there is no undo.
  bool dry_run = 3;
}
message RebindResponse {
  // changes is one entry per touched bucket.
  repeated RebindBucketChange changes = 1;
  // conflicts are records this cannot rebind, each with the reason.
  // Reported rather than skipped silently: a half-moved identity is
  // worse than one that did not move, because nothing says which half.
  repeated string conflicts = 2;
  // applied is how many records were actually written. On a partial
  // failure it says how far the rebind got — "rebind failed" without a
  // number leaves somebody unable to tell a no-op from a half-done
  // move.
  int32 applied = 3;
}
message RebindBucketChange {
  string bucket = 1;
  repeated string ids = 2;
}

// SessionService reads stored conversation transcripts.
//
// Read-only on purpose. Forgetting a conversation is a replicated
// mutation with its own path; an operator browsing what was said does
// not need one that can also delete it.
//
// Unscoped, like the other read services on this listener: the agent's
// per-turn scoping lives in the session BUILTINS, which is where it
// belongs, because that is the caller who must not read another user's
// conversation. This surface is for operators and peers behind mTLS.
service SessionService {
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse);
  rpc GetSession(GetSessionRequest) returns (GetSessionResponse);
  rpc SearchSessions(SearchSessionsRequest) returns (SearchSessionsResponse);
}

message ListSessionsRequest {
  string channel = 1;
  string user_id = 2;
}
message ListSessionsResponse {
  // Most recently updated first. Session ids are addresses rather than
  // sequence, so there is no other natural order.
  repeated SessionRecord sessions = 1;
}

message GetSessionRequest {
  string id = 1;
}
message GetSessionResponse {
  SessionRecord session = 1;
  // The full transcript in sequence order.
  repeated SessionMessage messages = 2;
}

message SearchSessionsRequest {
  // Matched case-insensitively against message content. Required —
  // this is search, not enumeration; ListSessions covers that.
  string text = 1;
  string channel = 2;
  string user_id = 3;
  // limit caps SESSIONS, not messages. Zero takes the service default.
  int32 limit = 4;
  int32 snippets_per_session = 5;
}
message SessionSnippetProto {
  uint64 seq = 1;
  string role = 2;
  string text = 3;
}
message SessionSearchHitProto {
  SessionRecord session = 1;
  // matches is every matching message, which may exceed the snippets
  // returned — so a caller can tell a passing mention from a thread
  // about the thing.
  int32 matches = 2;
  repeated SessionSnippetProto snippets = 3;
}
message SearchSessionsResponse {
  repeated SessionSearchHitProto hits = 1;
}

message SessionRecord {
  string id = 1; // "<channel>:<channel_id>" — bucket key
  string channel = 2; // gateway channel kind: "telegram", "rest", ...
  string channel_id = 3; // channel-native conversation id (chat_id, ...)
  string user_id = 4; // canonical user id of the participant
  string title = 5; // human-readable label; empty until summarised
  // next_seq is the sequence number the next appended message takes.
  // Monotonic per session and never reused, so message keys are stable
  // even after trimming.
  uint64 next_seq = 6;
  // first_seq is the oldest sequence still retained. Advances when the
  // append path trims to the message cap. next_seq - first_seq is the
  // live message count.
  uint64 first_seq = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
  // summary is the running prose summary of everything in this
  // conversation up to and including summary_through_seq. It is
  // rebuilt incrementally: each compaction folds the newly-aged-out
  // messages into the previous summary rather than re-reading the
  // whole transcript, so a message is summarised roughly once
  // instead of once per turn.
  //
  // Empty until a conversation is long enough to need compacting.
  string summary = 10;
  // summary_through_seq is the highest sequence number the summary
  // covers. Messages after it are replayed verbatim; messages up to
  // it are represented only by the summary. 0 = nothing summarised.
  uint64 summary_through_seq = 11;
  google.protobuf.Timestamp summary_updated_at = 12;
}

// SessionMessage is one message in a transcript — the persisted form of
// the agent's in-memory Message. Roles match the LLM wire protocol:
// "system" | "user" | "assistant" | "tool".
//
// System messages are NOT persisted: the system prompt is rebuilt per
// turn by promptgen (it embeds live SOUL state, tool lists, and time),
// so storing a stale copy would be actively misleading on replay.
message SessionMessage {
  string session_id = 1;
  uint64 seq = 2;
  string role = 3;
  string content = 4;
  // tool_calls is populated on assistant messages that requested tool
  // invocations; tool_call_id is populated on role="tool" results and
  // correlates back to the requesting call.
  repeated SessionToolCall tool_calls = 5;
  string tool_call_id = 6;
  // turn_id ties every message produced by one user turn together, for
  // audit correlation and for trimming on turn boundaries.
  string turn_id = 7;
  google.protobuf.Timestamp timestamp = 8;
}

// SessionToolCall mirrors the tool-call shape on the LLM wire.
message SessionToolCall {
  string id = 1;
  string name = 2;
  string arguments = 3; // JSON-encoded
}

// SessionAppendRecord is the atomic unit of a session write: the updated
// index record, the messages produced by the turn, and the message keys
// the trim evicted — all applied in one raft entry so a session can
// never be observed with a torn transcript.
//
// **evict_keys is computed on the leader and shipped explicitly** rather
// than recomputed inside the FSM. The FSM must be deterministic across
// live apply and log replay (see fsm.applyClaim's comment for what
// happens when it isn't); shipping the decision makes replay a pure
// function of the entry.
message SessionAppendRecord {
  SessionRecord session = 1;
  repeated SessionMessage messages = 2;
  repeated string evict_keys = 3;
}

// -----------------------------------------------------------------------------
// Raft log entry envelope
// -----------------------------------------------------------------------------
//
// Every write that goes through Raft is wrapped in a LogEntry. The FSM's
// Apply unmarshals the []byte log payload as LogEntry and dispatches on
// op kind. Delete operations carry only the target id; all other ops
// carry a typed payload.

enum LogOp {
  LOG_OP_UNSPECIFIED = 0;
  LOG_OP_PUT = 1;
  LOG_OP_DELETE = 2;
  // Conditional write: FSM reads the current record and checks that
  // its claimed_by equals expected_claimer before applying payload.
  // On mismatch the Apply returns an error so the caller's
  // raft.Apply() call surfaces ErrClaimConflict. Empty expected
  // means "expect unclaimed"; applied expiry past now is also
  // treated as unclaimed.
  LOG_OP_CLAIM = 3;
}

// SessionLease is cluster-wide ownership of one conversation for the
// duration of a turn.
//
// A turn is: load history, run the agent for seconds with tool loops,
// append the result. Two turns on the same conversation must not
// overlap, or both read the same prior history and both append it.
// The gateway serialises turns within a process; this is the part
// that holds across nodes, because a conversation can be reached from
// more than one gateway at once (a webhook and a REST client, or two
// gateways behind a load balancer).
//
// Deliberately its own record rather than fields on SessionRecord.
// Lease churn — claim, heartbeat, release — would otherwise bump the
// session's revision on every turn and collide with the transcript
// appends written by the very turn that holds the lease.
message SessionLease {
  // id is the conversation key, "<channel>:<channel_id>".
  string id = 1;
  string claimed_by = 2;
  google.protobuf.Timestamp claim_expires_at = 3;
  // turn_id is diagnostic: it tells an operator which turn is holding
  // a conversation that appears stuck.
  string turn_id = 4;
  // revision — see ScheduledTaskRecord.revision.
  uint64 revision = 5;
}

message LogEntry {
  LogOp op = 1;
  // Target record id for DELETE; same id also duplicates the record's
  // id field for PUT (eases indexing without fully decoding the payload).
  string id = 2;
  oneof payload {
    PolicyRule policy_rule = 10;
    ScheduledTaskRecord scheduled_task = 11;
    AgentCommitment commitment = 12;
    AuditEntry audit_entry = 13;
    VectorRecord vector_record = 14;
    EpisodicRecord episodic_record = 15;
    StorageMount storage_mount = 16;
    ChannelStateRecord channel_state = 17;
    SoulTuneRecord soul_tune = 18;
    CredentialRecord credential = 19;
    UserPreferences user_prefs = 21;
    // session_append carries a whole turn (index + messages + evictions)
    // under LOG_OP_PUT; session carries just an id under LOG_OP_DELETE,
    // where the FSM also purges the session's message key range.
    SessionAppendRecord session_append = 22;
    SessionRecord session = 23;
    SessionLease session_lease = 25;
    PromptRecord prompt = 26;
    ConsolidationRecord consolidation = 27;
    PinnedMemory pinned = 28;
    SelfTaughtRecord self_taught = 29;
    SelfTaughtUsage self_taught_usage = 30;
    // A history entry is the same message in a different bucket: a
    // prior version is a record, not a different kind of thing.
    SelfTaughtRecord self_taught_history = 31;
    SessionGrant session_grant = 32;
    SkillRecord skill = 33;
    SkillBlob skill_blob = 34;
    EnrolmentRecord enrolment = 35;
  }
  // LOG_OP_CLAIM only: the value we expect on the current record's
  // claimed_by field before we write. Used to enforce CAS semantics.
  // Ignored for PUT / DELETE.
  string expected_claimer = 20;

  // expected_revision is the record revision the writer read before
  // building this entry. The FSM rejects the write if the stored
  // revision has moved, which is what makes a read-modify-write safe:
  // claimed_by alone cannot tell "nobody holds this" apart from
  // "somebody held it, finished, and released it", so a claimer
  // working from a stale read would both re-fire the task and write
  // its stale copy back over the completion.
  //
  // Explicitly optional rather than defaulting to "no check". A
  // uint64 whose zero value means unconditional would make the unsafe
  // behaviour what a caller gets by forgetting the field — the same
  // shape as the scopeFilter="" bug that memory.Audience exists to
  // prevent. LOG_OP_CLAIM requires it and is rejected without it;
  // PUT / DELETE ignore it, since a create has no prior revision.
  optional uint64 expected_revision = 24;
}

// PromptDecision is the resolution state of a confirmation.
enum PromptDecision {
  PROMPT_DECISION_UNSPECIFIED = 0;
  PROMPT_DECISION_PENDING = 1;
  PROMPT_DECISION_APPROVED = 2;
  PROMPT_DECISION_DENIED = 3;
  PROMPT_DECISION_TIMED_OUT = 4;
}

// PromptScope is how far an approval reaches. See R2.
enum PromptScope {
  PROMPT_SCOPE_UNSPECIFIED = 0;
  // This turn only — the behaviour every confirmation had before.
  PROMPT_SCOPE_ONCE = 1;
  // The rest of this conversation; expires with the session.
  PROMPT_SCOPE_SESSION = 2;
  // Mints a policy rule, so it is visible and revocable rather than
  // an invisible forever-grant.
  PROMPT_SCOPE_ALWAYS = 3;
}

// SkillTier is where a skill came from. Ordered: a higher tier wins a
// contested name.
enum SkillTier {
  SKILL_TIER_UNSPECIFIED = 0;
  SKILL_TIER_AGENT = 1;
  SKILL_TIER_OPERATOR = 2;
  SKILL_TIER_SIGNED = 3;
}

// SkillRecord is one installed skill, in the cluster store.
//
// Authority moves here from the filesystem. A skill exists because the
// log says so, not because a mount happens to be materialised on the
// node you asked — which is what made "is this skill installed?" a
// question with a per-node answer.
message SkillRecord {
  string name = 1;
  string version = 2;
  SkillTier tier = 3;

  // manifest_yaml is the manifest file's bytes, VERBATIM.
  //
  // Not a parsed struct, and this is the single most important
  // decision in the message. The signature is a detached ed25519
  // signature over the exact file: parsing into a proto and
  // re-serialising on export changes the bytes and breaks
  // verification permanently, so a skill that genuinely was signed
  // would be rejected by every SigningRequire deployment after one
  // round trip through the store.
  //
  // Round-tripping the bytes untouched is what keeps signing working
  // across the move.
  bytes manifest_yaml = 4;
  // manifest_sig is the detached signature, if the skill shipped one.
  bytes manifest_sig = 5;

  // files maps a relative path to the DIGEST of its content, with the
  // bytes in BucketSkillBlobs. Indirected rather than inlined so two
  // versions of a skill that share a reference store it once, and so
  // a record stays small enough to read without pulling every payload
  // it mentions.
  map<string, string> files = 6;

  // source records where it came from — a clawhub URL, an import
  // path. Provenance an operator can audit later, when the question
  // is "why is this here".
  string source = 7;
  string imported_by = 8;
  google.protobuf.Timestamp imported_at = 9;

  // active marks the version in force. One per (name, tier): a store
  // that held two active versions of one skill would make the
  // registry's winner depend on iteration order.
  bool active = 10;

  uint64 revision = 11;
  string claimed_by = 12;
}

// SkillBlob is one content-addressed payload — a handler, a reference
// document. Keyed by digest, so identical content across skills and
// versions is stored once.
message SkillBlob {
  // digest is "sha256:<hex>", which is also the bucket key.
  string digest = 1;
  bytes content = 2;
  uint64 revision = 3;
  string claimed_by = 4;
}

// SessionGrant is an "approved for the rest of this conversation"
// answer, made durable and cluster-wide.
//
// It was an in-process map, and the argument for that was real: a
// grant that outlives what the user was looking at is one they did not
// knowingly give. But that argument covers the RESTART axis only. On
// the cluster axis it never held — the same conversation, the same
// continuity the user was reasoning about, and they were re-prompted
// anyway because the next message happened to land on a different
// node. That is not the continuity ending; that is routing.
//
// So the grant is replicated, and the bound that the dying process
// used to provide is made explicit as expires_at.
message SessionGrant {
  // id is "<session_id>\x00<action>\x00<resource>". NUL separates the
  // parts so a channel id containing the separator cannot forge a key
  // belonging to a different conversation.
  string id = 1;
  // session_id is "<channel>:<channel_id>" — the same key
  // SessionRecord uses, so dropping a conversation can drop its
  // grants by prefix.
  //
  // Keyed by CONVERSATION rather than by user, deliberately: the
  // confirmation was shown in a conversation and answered there, and
  // in a group chat the person who taps Approve is approving for that
  // chat. Widening it to the user across every conversation would
  // grant more than the button appeared to offer.
  string session_id = 2;
  string action = 3;
  string resource = 4;
  // granted_by is the principal who tapped it, so a listing can say
  // who — an unattributable standing grant is one nobody can audit.
  string granted_by = 5;
  // prompt_id is the confirmation this came from. Provenance, for the
  // same reason an approval-minted policy rule carries it.
  string prompt_id = 6;
  google.protobuf.Timestamp granted_at = 7;
  // expires_at bounds the grant explicitly.
  //
  // The process exiting used to be the bound, which meant the lifetime
  // of a security grant was decided by deploy cadence — long on a
  // stable cluster, minutes during a rollout. Neither is a decision
  // anybody made. A stated TTL is.
  google.protobuf.Timestamp expires_at = 8;
  uint64 revision = 9;
  string claimed_by = 10;
}

// Continuation is everything needed to resume a turn on a different
// node. The in-memory registry stashed a live []Message and a
// *TurnBudget in a Go map, which is precisely what stopped an
// approval from being answerable anywhere but the node that asked.
message Continuation {
  repeated SessionMessage messages = 1;
  // Budget counters, so a resumed turn does not restart its spend.
  double spent_usd = 2;
  int32 tool_calls = 3;
  int32 llm_calls = 4;
  bool relaxed = 5;
  // system_prompt is carried rather than rebuilt: the resuming node
  // may have a different SOUL, and the turn should finish as the one
  // that started it, not as a different assistant.
  string system_prompt = 6;
  // The rest of what ProcessMessageRequest needs to be rebuilt.
  // Tools are deliberately absent — they are node state, rebuilt from
  // the resuming node's own registry. Carrying them would let a
  // stale definition outlive a redeploy.
  string user_message = 7;
  Claims claims = 8;
  string user_timezone = 9;
  string model = 10;
  string conversation_summary = 11;
  string recalled_context = 12;
  int64 egress_bytes = 13;
}

// PromptRecord is one pending confirmation, in Raft rather than in a
// process. Replaces the in-memory PromptRegistry: an approval tapped
// on one node resolves a prompt issued by another, and survives a
// restart instead of telling the user to resend.
message PromptRecord {
  string id = 1;
  string turn_id = 2;
  string session_id = 3;
  string reason = 4;
  string channel = 5;
  // Where to deliver the resolution — the node that resumes the turn
  // need not be the node that asked.
  string channel_id = 6;
  PromptDecision decision = 7;
  PromptScope scope = 8;
  // The principal who answered, for audit.
  string resolved_by = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp expires_at = 11;
  Continuation continuation = 12;
  // Policy action and resource, carried so PROMPT_SCOPE_ALWAYS can
  // mint a rule that names what was actually approved.
  string action = 13;
  string resource = 14;
  string owner = 15;

  // Resolution is a CAS from PENDING, reusing the claim primitive the
  // scheduler already has: claimed_by holds the resolver and revision
  // guards the transition, so first writer wins cluster-wide.
  string claimed_by = 16;
  google.protobuf.Timestamp claim_expires_at = 17;
  uint64 revision = 18;
  // raised_for is the channel-native audience: only they may answer.
  //
  // Carried on the DURABLE record, not just in memory. The in-memory
  // registry had it and this did not, so on a real node the field was
  // dropped in conversion and every prompt came back unattributable —
  // the fail-closed guard then refused the very person it was raised
  // for, and said so on their screen.
  string raised_for = 19;

  // enrolment links this question to an operator enrolment request,
  // for the same reason: the answer has to reach something other than
  // a paused turn.
  string enrolment = 20;
}
