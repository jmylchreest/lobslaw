# Secret-scanner config.
#
# betterleaks is installed @latest on purpose (see `hook-tools` in the
# Makefile): a scanner is only as good as its newest rules. The cost of
# that choice is that a new rule can land on an unrelated pull request,
# which is what this file is for — it records the findings we have
# looked at and rejected, so the next person does not re-investigate
# them.
#
# Add to it only after reading the flagged line. An allowlist entry is
# a claim that a human checked and it was not a credential.

[extend]
useDefault = true

[[allowlists]]
description = """
The egress proxy's Basic-auth preamble carries the ROLE as the
username and a literal underscore as the password — smokescreen
reads the role and ignores the password, and the surrounding prose
says so. Matched by generic-credential-uri (new in betterleaks
v1.8.0) because the shape is user:pass@host regardless of what the
password is.
"""
# AND, not the default OR: with either alone this would allowlist
# the whole file, so a REAL credential added to that page later would
# be waved through by an entry written about a placeholder.
condition = "AND"
# Matched against the whole URI, not the extracted secret: the secret
# here IS the underscore, and a regex for "_" would allowlist every
# one-character credential anywhere.
regexTarget = "match"
paths = ['''docs/docs/security/egress-and-acl\.md''']
regexes = ['''skill%2F[a-z0-9-]+:_@127\.0\.0\.1''']
