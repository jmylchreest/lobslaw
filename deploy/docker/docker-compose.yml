# lobslaw single-node compose stack.
#
# Topology:
#   cert-init     one-shot — runs `lobslaw cluster sign-node` against
#                 the cluster CA (mounted as compose secrets) and
#                 writes this node's mTLS cert into a shared volume.
#                 Re-runs on each compose-up and always overwrites, so
#                 a hostname change on the next boot regenerates the
#                 cert automatically. The CA private key is supplied as
#                 a secret and is NEVER mounted into the main lobslaw
#                 container — it lives only here.
#   lobslaw       the long-running agent.
#   tools         long-running shell sidecar — `docker compose exec
#                 tools sh` for poking around the volumes.
#
# The runtime image is debian:12-slim and carries a full GNU userland
# (sh, bash, coreutils, grep, sed, awk, tar, curl, git), so the agent's
# shell_command builtin has a working shell without any sidecar seeding
# tools into a shared volume. Heavier runtimes — python3, ruby, jq,
# openssh — live in Dockerfile.tools; swap the `dockerfile:` below to
# use it. Binaries installed at runtime by the binary_install builtin
# land in the binaries-workspace volume.
#
# Hostname → node id: lobslaw derives raft.ServerID from os.Hostname()
# (short hostname, lowercased). hostname is set explicitly here so
# cert-init and lobslaw agree on what to sign. Override via
# $LOBSLAW_HOSTNAME in .env.
#
# For a 3-node cluster on one host, see cluster.yml.

services:

  # ---- cert-init ----------------------------------------------------
  # Runs as root and with entrypoint cleared: it needs a shell, and it
  # needs chown/chmod to hand the certs volume to the nonroot runtime
  # user the lobslaw service runs as.
  cert-init:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: lobslaw:dev
    hostname: ${LOBSLAW_HOSTNAME:-lobslaw-1}
    user: "0:0"
    entrypoint: []
    command:
      - /bin/bash
      - -c
      - |
        set -e
        /usr/local/bin/lobslaw cluster sign-node \
          --ca-cert=/run/secrets/ca_cert \
          --ca-key=/run/secrets/ca_key \
          --node-cert=/etc/lobslaw/certs/node-cert.pem \
          --node-key=/etc/lobslaw/certs/node-key.pem \
          --copy-ca-public=true
        chown -R 65532:65532 /etc/lobslaw/certs
        chmod 0755 /etc/lobslaw/certs
        chmod 0644 /etc/lobslaw/certs/node-cert.pem /etc/lobslaw/certs/ca.pem
        chmod 0600 /etc/lobslaw/certs/node-key.pem
        echo "cert-init: signed cert for ${LOBSLAW_HOSTNAME:-lobslaw-1}"
    secrets:
      - ca_cert
      - ca_key
    volumes:
      - certs:/etc/lobslaw/certs
    restart: "no"

  # ---- lobslaw (main) -----------------------------------------------
  lobslaw:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: lobslaw:dev
    hostname: ${LOBSLAW_HOSTNAME:-lobslaw-1}
    # No `command:` — the image defaults to `run`.
    environment:
      - LOBSLAW_CONFIG=/etc/lobslaw/config.toml
      - LOBSLAW_MEMORY_KEY=${LOBSLAW_MEMORY_KEY}
      - LOBSLAW_MINIMAX_API_KEY=${LOBSLAW_MINIMAX_API_KEY:-}
      - LOBSLAW_OPENROUTER_API_KEY=${LOBSLAW_OPENROUTER_API_KEY:-}
      - LOBSLAW_TELEGRAM_BOT_TOKEN=${LOBSLAW_TELEGRAM_BOT_TOKEN:-}
      - LOBSLAW_EXA_API_KEY=${LOBSLAW_EXA_API_KEY:-}
      # binary_install's prefix goes first so a runtime-installed tool
      # wins over an image-baked one of the same name.
      - PATH=/lobslaw/usr/local/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
      - TZ=${TZ:-UTC}
      - LOBSLAW_LOG_LEVEL=${LOBSLAW_LOG_LEVEL:-info}
      - LOBSLAW_LOG_FORMAT=${LOBSLAW_LOG_FORMAT:-json}
    volumes:
      # Where binary_install lands user-mode installs. Drop this entry
      # to make them ephemeral — they'd live on the container's
      # writable layer and reset on every restart.
      - binaries-workspace:/lobslaw/usr/local
      # mTLS material. CA private key intentionally absent — only
      # cert-init has access to it, via the compose secret.
      - certs:/etc/lobslaw/certs:ro
      # Raft + memory FSM state. Persistent across restarts.
      - data:/var/lobslaw/data
      # Audit log (local JSONL sink).
      - audit:/var/lobslaw/audit
      # Skill bundles landed by clawhub_install.
      - skills:/var/lobslaw/skills
      # Operator-edited config + soul. config.toml is read-only; SOUL.md
      # is writable because the soul_* builtins edit it in place.
      - ${LOBSLAW_CONFIG_FILE:-./config.toml}:/etc/lobslaw/config.toml:ro
      - ${LOBSLAW_SOUL_FILE:-./SOUL.md}:/etc/lobslaw/SOUL.md:rw
      # Workspace storage mount — agent reads/writes user files here.
      - ${HOME}/.config/lobslaw/workspace:/workspace:rw,U
    ports:
      - "${LOBSLAW_CLUSTER_PORT:-7443}:7443"
      - "${LOBSLAW_GATEWAY_PORT:-8443}:8443"
    depends_on:
      cert-init:
        condition: service_completed_successfully
    restart: unless-stopped
    # Headroom over lobslaw's internal 10s gRPC GracefulStop ceiling
    # (internal/node/node.go Shutdown), so storage/audit/raft/store
    # close steps complete before SIGKILL when an in-flight stream
    # consumes the full graceful-stop window.
    stop_grace_period: 30s

  # ---- tools (long-running shell sidecar) ---------------------------
  # `docker compose exec tools sh` for ad-hoc inspection of the
  # volumes. Shares binaries-workspace with the lobslaw service, so a
  # binary dropped in here is on the agent's PATH immediately.
  tools:
    image: busybox:glibc
    hostname: ${LOBSLAW_HOSTNAME:-lobslaw-1}-tools
    command: ["sleep", "infinity"]
    environment:
      - PATH=/lobslaw/usr/local/bin:/usr/local/bin:/usr/bin:/bin:/usr/local/sbin:/usr/sbin:/sbin
    volumes:
      - binaries-workspace:/lobslaw/usr/local
      - data:/var/lobslaw/data:ro
      - audit:/var/lobslaw/audit:ro
      - skills:/var/lobslaw/skills:ro
      - certs:/etc/lobslaw/certs:ro
      - ${HOME}/.config/lobslaw/workspace:/workspace:rw,U
    restart: unless-stopped

secrets:
  ca_cert:
    file: ./secrets/ca.pem
  ca_key:
    file: ./secrets/ca-key.pem

volumes:
  # Operator-owned scratch where binary_install lands user-mode
  # installs (gh-release, brew, curl-sh, npm/cargo/uvx/pipx/...).
  binaries-workspace:
  # Persistent. Cert is regenerated each compose-up but the volume
  # holds the result so lobslaw and tools see the same cert.
  certs:
  # Persistent raft + state. `lobslaw cluster reset` for a clean start.
  data:
  audit:
  skills:
