name: test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.scope.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only "$BASE_SHA" HEAD > "$RUNNER_TEMP/changed-files"
          fi
          if [ "$EVENT" != pull_request ] || grep -Eq '\.go$|^go\.(mod|sum)$|^Makefile$|^\.github/|^scripts/|^test|^proto/' "$RUNNER_TEMP/changed-files"; then
            echo 'backend=true' >> "$GITHUB_OUTPUT"
          else
            echo 'backend=false' >> "$GITHUB_OUTPUT"
          fi
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: build web console
        run: make web

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: web-console
          path: internal/gateway/ui/dist
          retention-days: 1
          if-no-files-found: error
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: verify modules
        run: |
          go mod download
          go mod verify

      # Build the console so the integration test that boots a node and
      # fetches it actually RUNS here. It skips when the assets are
      # absent, which is right for a fresh clone but was wrong for CI.
      - name: setup node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install console test dependencies
        run: npm --prefix web ci
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-console
          path: internal/gateway/ui/dist
      - name: Cache buf tool
        id: buf-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/go/bin/buf
          key: buf-${{ runner.os }}-${{ runner.arch }}-v1.68.4
      - name: install buf for browser contract generation
        run: go install github.com/bufbuild/buf/cmd/buf@v1.68.4

        if: steps.buf-cache.outputs.cache-hit != 'true'
      - name: verify generated browser contracts
        run: |
          npm --prefix web run proto
          git diff --exit-code -- web/src/gen

      - name: test no-web build
        run: |
          go build -tags no_web ./...
          go test -tags no_web ./internal/gateway/... ./internal/node/...

      - name: test the console
        run: npm --prefix web test

      - name: test
        run: go test -race -cover -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # The AVX2 embedding kernel lives behind `goexperiment.simd &&
      # amd64`, so the job above compiles NONE of it — not the kernel,
      # not the packed GEMM, not the tests asserting it agrees with the
      # portable path. Passing locally is not the same as being covered,
      # and a build nobody runs is a build that rots.
      #
      # Scoped to the one package that has a second kernel: the rest of
      # the module is identical under either build, so running the whole
      # suite twice would double CI time to re-prove the same thing.
      - name: test simd kernel
        run: GOEXPERIMENT=simd go test -race -count=1 ./internal/embedder/... ./internal/compute/...

      - name: vet simd kernel
        run: GOEXPERIMENT=simd go vet ./internal/embedder/...

  # THE EMBEDDER'S REAL TESTS, which need a checkpoint.
  #
  # Without one, 17 of its 42 tests SKIP — the golden parity gate, the
  # whole tokenizer suite, semantic recall, cross-lingual retrieval,
  # concurrency and chunking. Everything else can pass while the
  # encoder is quietly wrong.
  #
  # A SEPARATE JOB because it does not fit in the main one. Under -race
  # the suite takes ~5 minutes on twelve cores and far longer on a
  # runner, so folding it in would have made every PR wait on it. Here
  # it runs alongside, and only the concurrency test — the one whose
  # entire purpose is detecting a race — pays for the detector.
    needs: web
  embedder:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # TWO checkpoints, because they exercise different halves.
      #
      #   all-MiniLM-L6-v2        91 MB   WordPiece + BertNormalizer
      #   multilingual-e5-small  471 MB   SentencePiece Unigram + charsmap
      #
      # One would leave a whole tokenizer untested, and the two disagree
      # on more than the tokenizer: MiniLM is a plain BERT with position
      # offset 0 and a 30k vocabulary, e5-small is XLM-RoBERTa with
      # offset 2 and 250k. Each has its own committed fixtures.
      #
      # Cached, so a normal run fetches nothing.
      - name: cache embedding model
        id: model-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/models
          key: embed-models-v3

      - name: fetch embedding model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          fetch() {
            base="$1"; dir="${{ runner.temp }}/models/$2"
            mkdir -p "$dir/1_Pooling"
            for f in config.json model.safetensors tokenizer.json tokenizer_config.json; do
              curl -fsSL --retry 3 -o "$dir/$f" "$base/$f"
            done
            # A release asset cannot be named "1_Pooling/config.json",
            # so mirrors carry it flattened. Either shape is fine.
            curl -fsSL --retry 3 -o "$dir/1_Pooling/config.json" "$base/1_Pooling/config.json" \
              || curl -fsSL --retry 3 -o "$dir/1_Pooling/config.json" "$base/1_Pooling.config.json"
          }
          # MiniLM from our own release: pinned bytes, and one fewer
          # third party CI depends on being up.
          fetch https://github.com/jmylchreest/lobslaw/releases/download/models-all-MiniLM-L6-v2 all-MiniLM-L6-v2
          fetch https://huggingface.co/intfloat/multilingual-e5-small/resolve/main multilingual-e5-small

      - name: embedder tests (WordPiece / BERT)
        env:
          # Absolute: a tilde in a YAML env: value is a literal tilde,
          # not $HOME, so Go would be handed a path that cannot exist.
          LOBSLAW_EMBEDDER_MODEL: ${{ runner.temp }}/models/all-MiniLM-L6-v2
        run: go test -timeout 20m -count=1 ./internal/embedder/...

      - name: embedder tests (Unigram / XLM-RoBERTa)
        env:
          LOBSLAW_EMBEDDER_MODEL: ${{ runner.temp }}/models/multilingual-e5-small
        run: go test -timeout 20m -count=1 ./internal/embedder/...

      - name: embedder tests, AVX2 kernel
        env:
          LOBSLAW_EMBEDDER_MODEL: ${{ runner.temp }}/models/multilingual-e5-small
        run: GOEXPERIMENT=simd go test -timeout 20m -count=1 ./internal/embedder/...

      # Only the test that exists to find races pays for the detector.
      - name: concurrency under -race
        env:
          LOBSLAW_EMBEDDER_MODEL: ${{ runner.temp }}/models/multilingual-e5-small
        run: go test -race -timeout 20m -count=1 -run 'TestConcurrent|TestCloseIsSafe' ./internal/embedder/...

    needs: changes
    if: needs.changes.outputs.backend == 'true'
  rolling-upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: checkout contract-1 baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 246a8e7d68f71d5e7138eb262a205cceeb51f3e0
          path: .rolling-baseline
      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: compile genuine baseline binary
        working-directory: .rolling-baseline
        run: go test -c -o "$RUNNER_TEMP/rolling-baseline.test" ./internal/memory
      - name: exercise mixed binaries and activation
        env:
          LOBSLAW_ROLLING_BASELINE: ${{ runner.temp }}/rolling-baseline.test
        run: go test -race -count=1 -timeout 3m -run '^TestRollingMixedBinaries$' ./internal/memory

    needs: changes
    if: needs.changes.outputs.backend == 'true'
  automatic-upgrade:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: checkout pre-automatic contract-2 baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: 5576af6fb9cf7f42259e76b0c19def24d53dd26f
          path: .automatic-baseline
      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true
      - name: compile genuine baseline binary
        working-directory: .automatic-baseline
        run: go test -c -o "$RUNNER_TEMP/automatic-baseline.test" ./internal/memory
      - name: exercise automatic activation with mixed binaries
        env:
          LOBSLAW_AUTOMATIC_BASELINE: ${{ runner.temp }}/automatic-baseline.test
        run: go test -race -count=1 -timeout 3m -run '^TestRollingAutomaticUpgrade$' ./internal/memory
    needs: changes
    if: needs.changes.outputs.backend == 'true'
  build:
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.os }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: ubuntu-latest
          - os: darwin
            arch: arm64
            runner: ubuntu-latest
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # The console is embedded with go:embed from a gitignored
      # directory, so a `go build` that has not been preceded by this
      # produces a binary whose console answers ErrNotBuilt.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: web-console
          path: internal/gateway/ui/dist
      - name: build
        run: |
          VERSION="${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)"
          COMMIT="$(git rev-parse HEAD)"
          # The COMMIT's time, not the wall clock: a release built
          # twice from one tag must produce the same bytes, and a
          # timestamp taken at build time is the usual reason it does
          # not. Local and container builds stamp the real build time,
          # where reproducibility buys nothing and "when did I last
          # rebuild this" is the question being asked.
          BUILD_DATE="$(git show -s --format=%cI HEAD)"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}"
          mkdir -p dist
          go build -trimpath -ldflags "${LDFLAGS}" -o "dist/lobslaw-${GOOS}-${GOARCH}" ./cmd/lobslaw
    needs: web
