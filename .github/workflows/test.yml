name: test

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: verify modules
        run: |
          go mod download
          go mod verify

      # WITHOUT A MODEL, 17 OF THE EMBEDDER'S 42 TESTS SKIP — and they
      # are the ones that matter: the golden parity gate, the entire
      # tokenizer suite, semantic recall, cross-lingual retrieval,
      # concurrency and chunking. Everything else can pass while the
      # encoder is quietly wrong.
      #
      # multilingual-e5-small is 466 MB and MIT-licensed, and it is
      # XLM-RoBERTa — so it exercises the SentencePiece Unigram
      # tokenizer and the same forward path as the larger checkpoints,
      # rather than being a stand-in that proves less.
      #
      # Cached on the revision so a normal run downloads nothing.
      - name: cache embedding model
        id: model-cache
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ${{ runner.temp }}/models/multilingual-e5-small
          key: e5-small-v1

      - name: fetch embedding model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base=https://huggingface.co/intfloat/multilingual-e5-small/resolve/main
          dir="${{ runner.temp }}/models/multilingual-e5-small"
          mkdir -p "$dir/1_Pooling"
          for f in config.json model.safetensors tokenizer.json tokenizer_config.json; do
            curl -fsSL --retry 3 -o "$dir/$f" "$base/$f"
          done
          curl -fsSL --retry 3 -o "$dir/1_Pooling/config.json" "$base/1_Pooling/config.json"

      - name: test
        env:
          # Absolute: a tilde in a YAML env: value is a literal tilde,
          # not $HOME, so Go was handed a path that does not exist.
          LOBSLAW_EMBEDDER_MODEL: ${{ runner.temp }}/models/multilingual-e5-small
        run: go test -race -cover -coverprofile=coverage.out ./...

      - name: coverage summary
        run: go tool cover -func=coverage.out | tail -1

      # The AVX2 embedding kernel lives behind `goexperiment.simd &&
      # amd64`, so the job above compiles NONE of it — not the kernel,
      # not the packed GEMM, not the tests asserting it agrees with the
      # portable path. Passing locally is not the same as being covered,
      # and a build nobody runs is a build that rots.
      #
      # Scoped to the one package that has a second kernel: the rest of
      # the module is identical under either build, so running the whole
      # suite twice would double CI time to re-prove the same thing.
      - name: test simd kernel
        env:
          # Absolute: a tilde in a YAML env: value is a literal tilde,
          # not $HOME, so Go was handed a path that does not exist.
          LOBSLAW_EMBEDDER_MODEL: ${{ runner.temp }}/models/multilingual-e5-small
        run: GOEXPERIMENT=simd go test -race -count=1 ./internal/embedder/... ./internal/compute/...

      - name: vet simd kernel
        run: GOEXPERIMENT=simd go vet ./internal/embedder/...
