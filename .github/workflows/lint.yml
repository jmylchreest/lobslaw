name: lint

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@1481404843c368bc19ca9406f87d6e0fc97bdcfd # v7.0.0
        with:
          # Pinned, not "latest". A linter release changes what counts
          # as a finding, so "latest" means an unrelated PR turns red
          # on a morning nobody touched the code — and CI disagrees
          # with whatever contributors have installed. v2.12 reported
          # 138 goconst findings that v2.10 did not. Keep in step with
          # GOLANGCI_LINT_VERSION in the Makefile, which is what `make
          # lint` installs locally.
          version: v2.12.2

      - name: go vet
        run: go vet ./...

      - name: gofmt check
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "Files need gofmt:"
            gofmt -l .
            exit 1
          fi

  buf:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # buf breaking needs the full history (or at least the base branch)
          # to compare against. fetch-depth: 0 is the simplest correct choice.
          fetch-depth: 0

      - name: setup buf
        uses: bufbuild/buf-action@fd21066df7214747548607aaa45548ba2b9bc1ff # v1.4.0
        with:
          lint: true
          breaking: true
          breaking_against: 'https://github.com/${{ github.repository }}.git#branch=main'
          # Off because the job holds contents:read only, and posting a
          # comment needs pull-requests:write. The findings are already
          # in the job log and the check status; a convenience comment
          # is not worth handing a third-party action write scope.
          pr_comment: false

  secrets:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # The scan walks history, not just the tip: a credential that was
          # committed and then removed is still published.
          fetch-depth: 0

      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      # Installed from source via the Makefile rather than a marketplace
      # action, so the version pin lives in one place and CI cannot drift from
      # what the pre-commit hook runs.
      - name: install betterleaks
        run: make hook-tools

      # The same scanner the pre-commit hook runs, so `git commit --no-verify`
      # delays the check rather than skipping it. --redact keeps a finding out
      # of the CI log, which is world-readable on a public repository.
      - name: scan for secrets
        run: "$(go env GOPATH)/bin/betterleaks git . --redact --no-banner"
