name: release

# Main builds publish main/latest plus an immutable SHA tag.
# The homelab follows main through Keel; version builds retain release tags.
#
#   git tag -a v0.1.0 -m 'first cluster deploy' && git push origin v0.1.0
#
# Consumed by namespaces/hermes/lobslaw.yaml in jmylchreest/homelab.
# See .github/CONTAINERS.md for publishing and deployment retention pins.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # Only main moves the deployment aliases; version and feature builds do not.
      - name: derive tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag
            type=sha,prefix=sha-,format=short

      # linux/amd64 only. The target cluster is x86 Proxmox nodes, and the
      # Dockerfile's build stage runs `go build` in the TARGET platform's
      # container -- so adding linux/arm64 here would compile Go under QEMU
      # emulation and take tens of minutes. To add arm64 properly, first make
      # the build stage cross-compile:
      #
      #   FROM --platform=$BUILDPLATFORM golang:${GO_VERSION} AS build
      #   ARG TARGETARCH
      #   RUN ... GOARCH=${TARGETARCH} go build ...
      #
      # then set platforms: linux/amd64,linux/arm64 below.
      - name: build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
