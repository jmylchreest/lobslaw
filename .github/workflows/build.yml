name: build

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

jobs:
  build:
    concurrency:
      group: build-${{ github.ref }}-${{ matrix.os }}-${{ matrix.arch }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            arch: amd64
            runner: ubuntu-latest
          - os: linux
            arch: arm64
            runner: ubuntu-latest
          - os: darwin
            arch: amd64
            runner: macos-latest
          - os: darwin
            arch: arm64
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      CGO_ENABLED: "0"
      GOOS: ${{ matrix.os }}
      GOARCH: ${{ matrix.arch }}
    steps:
      - name: checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: setup go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          cache: true

      - name: build
        run: |
          VERSION="${GITHUB_REF_NAME}-$(git rev-parse --short HEAD)"
          COMMIT="$(git rev-parse HEAD)"
          # The COMMIT's time, not the wall clock: a release built
          # twice from one tag must produce the same bytes, and a
          # timestamp taken at build time is the usual reason it does
          # not. Local and container builds stamp the real build time,
          # where reproducibility buys nothing and "when did I last
          # rebuild this" is the question being asked.
          BUILD_DATE="$(git show -s --format=%cI HEAD)"
          LDFLAGS="-s -w -X main.Version=${VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}"
          mkdir -p dist
          go build -trimpath -ldflags "${LDFLAGS}" -o "dist/lobslaw-${GOOS}-${GOARCH}" ./cmd/lobslaw
