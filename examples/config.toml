# Example lobslaw configuration.
#
# Secret references are resolved at load time:
#   env:VAR_NAME   read from process env
#   file:/path     read from file (trailing newline trimmed)
# Literal values without a scheme are rejected to stop accidental
# plaintext secrets in config files.
#
# Env-var overrides use double underscore between sections and keep
# single underscores within a key name:
#   LOBSLAW__MEMORY__RAFT_PORT=9999 → memory.raft_port
# See DESIGN.md for the full configuration reference.

# Node identity is derived at boot from $LOBSLAW_NODE_ID or the
# short hostname; the cert from `lobslaw cluster sign-node` is bound
# to that same value. There is no [node] section.

[memory]
enabled = true
raft_port = 2380

[memory.encryption]
# nacl/secretbox key for boltdb values. 32 bytes, base64-encoded.
key_ref = "env:LOBSLAW_MEMORY_KEY"

[memory.snapshot]
# Required when the cluster has < 3 nodes; startup fails without it.
target    = "storage:r2-backup"

[memory.dream]
# Cron expression for dream/REM consolidation.
schedule = "0 3 * * *"

# rclone mounts — each becomes /cluster/store/{label}/
#
# `type` names a registered backend: "local", "nfs" or "rclone".
# `remote` is the rclone remote, configured in rclone's own config;
# everything backend-specific goes in [storage.mounts.options], which is
# handed over verbatim. Keys ending in "_ref" are resolved as secret
# references before the backend starts, so no credential is written here.
[[storage.mounts]]
label  = "shared"
type   = "rclone"
remote = "aws"
bucket = "lobslaw-data"

[storage.mounts.options]
endpoint       = "https://s3.amazonaws.com"
access_key_ref = "env:AWS_ACCESS_KEY_ID"
secret_key_ref = "env:AWS_SECRET_ACCESS_KEY"

[[storage.mounts]]
label  = "r2-backup"
type   = "rclone"
remote = "r2"
bucket = "lobslaw-backup"

[storage.mounts.options]
account        = "YOUR_R2_ACCOUNT_ID"
access_key_ref = "env:R2_ACCESS_KEY_ID"
secret_key_ref = "env:R2_SECRET_ACCESS_KEY"

[policy]
enabled = true

[compute]
enabled             = true
default_chain       = "fast"

# What runs WITHOUT being asked about, as a set of labels. Approval is
# a subset check: every label a command carries must be in this set.
#   "strict"    approves nothing
#   "standard"  approves reads          (the default)
#   "trusted"   approves reads, writes
#   ["reads", "writes", "deletes"]      or say exactly what you mean
#
# Labels: reads, writes, deletes, disrupts, network, privilege.
# "unreadable" cannot be approved. No mode reaches the hardline floor.
# `lobslaw policy classify '<cmd>'` shows how any command is read.
approval_mode       = "standard"

# OpenRouter as the default example provider. Public trust tier.
[[compute.providers]]
label        = "fast"
endpoint     = "https://openrouter.ai/api/v1"
model        = "meta-llama/llama-3.1-8b-instruct"
api_key_ref  = "env:OPENROUTER_API_KEY_LOBSLAW"
trust_tier   = "public"
capabilities = ["function-calling"]

# Uncomment to add a private-tier provider (e.g. Anthropic via
# OpenAI-compatible endpoint):
# [[compute.providers]]
# label       = "smart"
# endpoint    = "https://api.anthropic.com/v1"
# model       = "claude-3-5-sonnet"
# api_key_ref = "env:ANTHROPIC_API_KEY"
# trust_tier  = "private"
# capabilities = ["function-calling", "vision"]

# Uncomment to run a local model as the most-private tier:
# [[compute.providers]]
# label      = "local"
# endpoint   = "http://localhost:8000/v1"
# model      = "llama-3.1-70b"
# trust_tier = "local"

[compute.budgets]
max_tool_calls_per_turn   = 30
max_spend_usd_per_turn    = 0.50
max_egress_bytes_per_turn = 10_000_000

# Chains route turns. A chain fires when its trigger matches the
# preflight's judgment of the turn, and picks where the provider
# backup-walk begins — so the trust floor, health cooldowns and
# per-attempt failover all still apply to everything after it.
#
# A chain LABELLED "fast" / "balanced" / "deep" / "reasoning" is also
# what the matching hint selects, so `hint` is sugar over these and
# editing the chain redefines what the hint means.
#
# [[compute.chains]]
# label = "deep"
# steps = [{ provider = "big-model" }]
# [compute.chains.trigger]
# min_complexity = 70
#
# A chain with more than one step runs as a PIPELINE, once the turn has
# an answer: step N's output is rendered into step N+1's
# prompt_template, and the last step's output is what the user gets.
# {{.Previous}} is the preceding output and {{.Message}} the original
# question. A step that fails, returns nothing, or has a template that
# will not render keeps the previous answer rather than losing it.
#
# [[compute.chains]]
# label = "reviewed"
# steps = [
#   { provider = "big-model" },
#   { provider = "careful-model", role = "reviewer", prompt_template = """
# The user asked: {{.Message}}
#
# A draft reply: {{.Previous}}
#
# Reply with an improved version, and nothing else.""" },
# ]
# [compute.chains.trigger]
# min_complexity = 85

# Plugins are installed with `lobslaw plugin install <source>`, which
# writes into the skills root. There is no [[compute.plugins]] section —
# there was one, and nothing read it.

[gateway]
enabled              = true
http_port            = 8080
confirmation_timeout = "5m"
unknown_user_scope   = ""  # empty = reject unknown users

[[gateway.channels]]
type          = "telegram"
bot_token_ref = "env:TELEGRAM_BOT_TOKEN"
# secret_token_ref configures Telegram's X-Telegram-Bot-Api-Secret-Token.
secret_token_ref = "env:TELEGRAM_WEBHOOK_SECRET"

[[gateway.channels]]
type     = "rest"
tls_cert = "/etc/lobslaw/cert.pem"
tls_key  = "/etc/lobslaw/key.pem"

[discovery]
seed_nodes          = []     # e.g. ["node2:9090", "node3:9090"]
broadcast           = true

[cluster]
# Where the cluster-internal gRPC listener binds. All cluster services
# (NodeService, MemoryService, PolicyService, RaftTransport, etc.) live
# here under mTLS. Default: ":7443".
listen_addr    = "0.0.0.0:7443"
# What peers dial to reach this node. Empty = derive from listen_addr.
# Set this to the pod IP or stable service DNS in k8s.
# advertise_addr = ""
# Where state.db, raft.db and snapshots/ live. Required if memory or
# policy function is enabled.
data_dir = "/var/lobslaw/data"
# bootstrap (default true): if no existing cluster is reachable via
# [discovery] seed_nodes within bootstrap_timeout, form a fresh
# single-voter cluster. Solo nodes leave this true. Production
# joiners flip it to false so a startup-time partition can't
# accidentally create a second cluster — they fail-fast instead.
# bootstrap = true
# bootstrap_timeout = "30s"

[cluster.mtls]
# Public CA cert, node cert + node key. CA private key is NOT here —
# it lives with the `lobslaw cluster sign-node` subcommand only
# (typically mounted into a k8s initContainer or a one-shot podman run).
ca_cert   = "/certs/ca.pem"
node_cert = "/certs/node-cert.pem"
node_key  = "/certs/node-key.pem"

[cluster.bootstrap]
# Single-node dev convenience: auto-generate CA + self-sign node cert
# on first startup if they don't exist. Leave false for production;
# production flows use `lobslaw cluster ca-init` + `cluster sign-node`.
auto_init = false

[soul]
path = "./SOUL.md"

# The scheduler has no configuration. It always runs, its loop interval
# and claim lease are internal, and tasks are not declared here.
#
# What schedules things:
#   - [memory.dream] schedule   the nightly consolidation pass
#   - the agent itself, through its schedule tool, at a user's request

[auth]
issuer       = "lobslaw"
jwks_url     = ""    # e.g. "https://accounts.google.com/.well-known/openid-configuration"
allow_hs256  = false # single-node HS256 fallback; RS256/EdDSA preferred

# The sandbox is described by policy.d files, not here. This section
# holds one key — where to look for them — and is omitted entirely in
# most deployments, because the default chain (user-global → config-dir
# → cwd) is what you want.
#
# [sandbox]
# policy_dirs = ["/etc/lobslaw/policy.d"]

[audit.raft]
enabled         = true

[audit.local]
enabled         = true
path            = "/var/lobslaw/audit/audit.jsonl"
max_size_mb     = 100
max_files       = 10

[skills]
require_signed     = false
trusted_publishers = "./trusted_publishers.toml"

[observability]
tracing_exporter = "stdout"  # "otlp" | "stdout" | "none"
# otlp_endpoint  = "http://localhost:4318"

[logging]
# Level + format can be left unset here and driven by --log-level /
# --log-format flags instead. The interesting part is filters.
# level  = "info"
# format = "auto"

# Uncomment to turn on debug logs only for a specific subsystem at
# startup. Each filter is slog-logfilter's first-match-wins:
#   type = "source:file"     pattern = "internal/memory/*"  → debug memory only
#   type = "turn_id"         pattern = "01HXY*"             → debug one turn
#   type = "source:function" pattern = "*Forget*"           → debug forget cascades
# Runtime mutation lands in Phase 11 via NodeService.Reload.
#
# [[logging.filters]]
# type    = "source:file"
# pattern = "internal/memory/*"
# level   = "debug"
# enabled = true

[config]
# Hot-reload: fsnotify on config.toml + SOUL.md + skill manifests.
watch       = true
debounce_ms = 1500
